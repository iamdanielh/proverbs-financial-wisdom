<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proverbs Financial Wisdom - Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #eaeaea;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 30px;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }
        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .tags-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .tag:hover, .tag.active {
            background: #e94560;
            border-color: #e94560;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(233, 69, 96, 0.5);
            box-shadow: 0 10px 40px rgba(233, 69, 96, 0.2);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .chapter-badge {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .verse-ref {
            color: #888;
            font-size: 0.85rem;
        }
        .card-title {
            font-size: 1.2rem;
            color: #feca57;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .scripture-text {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            font-style: italic;
            color: #ddd;
            margin-bottom: 15px;
            border-left: 3px solid #e94560;
        }
        .section {
            margin-top: 15px;
        }
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e94560;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .section-content {
            color: #bbb;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .bucket-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        .bucket-tag {
            background: rgba(254, 202, 87, 0.15);
            color: #feca57;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        .sources {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .source-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
        }
        .source-badge.chatgpt { background: rgba(16, 163, 127, 0.2); color: #10a37f; }
        .source-badge.gemini { background: rgba(66, 133, 244, 0.2); color: #4285f4; }
        .source-badge.grok { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: #666;
        }
        .error {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid #e94560;
            color: #e94560;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px;
        }
        .file-input {
            display: none;
        }
        .file-label {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        .file-label:hover {
            transform: scale(1.05);
        }
        .upload-section {
            text-align: center;
            padding: 50px;
        }
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
            .stats-bar {
                gap: 15px;
            }
            .stat-card {
                padding: 15px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Proverbs Financial Wisdom</h1>
        <p class="subtitle">Ancient Wisdom for Modern Wealth • Interactive Visualization</p>
        
        <div id="app">
            <div class="upload-section">
                <label for="fileInput" class="file-label">📤 Load JSON File</label>
                <input type="file" id="fileInput" class="file-input" accept=".json">
                <p style="color: #666; margin-top: 20px;">Upload <code>Unified.json</code> or any chapter JSON file</p>
            </div>
        </div>
    </div>

    <script>
        let proverbsData = [];
        let filteredData = [];
        let activeTag = null;
        let categories = new Set();

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        proverbsData = JSON.parse(e.target.result);
                        initApp();
                    } catch (err) {
                        showError('Invalid JSON file. Please upload a valid Proverbs JSON file.');
                    }
                };
                reader.readAsText(file);
            }
        });

        function initApp() {
            // Extract all unique categories
            proverbsData.forEach(item => {
                if (item.normalized_buckets) {
                    item.normalized_buckets.forEach(bucket => categories.add(bucket));
                }
            });
            
            filteredData = [...proverbsData];
            renderApp();
        }

        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="stats-bar">
                    <div class="stat-card">
                        <div class="stat-number">${proverbsData.length}</div>
                        <div class="stat-label">Wisdom Units</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${categories.size}</div>
                        <div class="stat-label">Categories</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${new Set(proverbsData.map(p => p.chapter)).size}</div>
                        <div class="stat-label">Chapters</div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn" onclick="exportData()">📥 Export Data</button>
                    <button class="btn" onclick="showCategoryStats()">📊 Category Stats</button>
                    <button class="btn" onclick="resetFilter()">🔄 Show All</button>
                </div>
                
                <div class="tags-container">
                    ${Array.from(categories).sort().map(cat => 
                        `<span class="tag ${activeTag === cat ? 'active' : ''}" onclick="filterByTag('${cat}')">${cat}</span>`
                    ).join('')}
                </div>
                
                <div class="cards-grid">
                    ${filteredData.map(item => createCard(item)).join('')}
                </div>
            `;
        }

        function createCard(item) {
            const sources = item.sources || [];
            const sourceBadges = sources.map(s => 
                `<span class="source-badge ${s.toLowerCase().trim()}">${s}</span>`
            ).join('');
            
            const buckets = item.normalized_buckets || [];
            const bucketTags = buckets.map(b => 
                `<span class="bucket-tag">${b}</span>`
            ).join('');
            
            const principles = item.principles || [];
            const applications = item.modern_applications || [];
            
            return `
                <div class="card">
                    <div class="card-header">
                        <span class="chapter-badge">Ch ${item.chapter}</span>
                        <span class="verse-ref">${item.verses}</span>
                    </div>
                    <h3 class="card-title">${item.suggested_chapter || 'Untitled'}</h3>
                    <div class="scripture-text">"${item.text || 'Text not available'}"</div>
                    
                    ${principles.length > 0 ? `
                        <div class="section">
                            <div class="section-title">💡 Principles</div>
                            <div class="section-content">
                                ${principles.map(p => `• ${p}`).join('<br>')}
                            </div>
                        </div>
                    ` : ''}
                    
                    ${applications.length > 0 ? `
                        <div class="section">
                            <div class="section-title">💼 Modern Applications</div>
                            <div class="section-content">
                                ${applications.map(a => `• ${a}`).join('<br>')}
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="bucket-tags">
                        ${bucketTags}
                    </div>
                    
                    <div class="sources">
                        <span style="color: #888; font-size: 0.8rem;">Sources:</span>
                        ${sourceBadges}
                    </div>
                </div>
            `;
        }

        function filterByTag(tag) {
            if (activeTag === tag) {
                activeTag = null;
                filteredData = [...proverbsData];
            } else {
                activeTag = tag;
                filteredData = proverbsData.filter(item => 
                    item.normalized_buckets && item.normalized_buckets.includes(tag)
                );
            }
            renderApp();
        }

        function resetFilter() {
            activeTag = null;
            filteredData = [...proverbsData];
            renderApp();
        }

        function showCategoryStats() {
            const stats = {};
            proverbsData.forEach(item => {
                if (item.normalized_buckets) {
                    item.normalized_buckets.forEach(bucket => {
                        stats[bucket] = (stats[bucket] || 0) + 1;
                    });
                }
            });
            
            const sorted = Object.entries(stats).sort((a, b) => b[1] - a[1]);
            const statsHtml = sorted.map(([cat, count]) => 
                `<div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <span>${cat}</span>
                    <span style="color: #e94560; font-weight: bold;">${count}</span>
                </div>`
            ).join('');
            
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.8); z-index: 1000; display: flex;
                align-items: center; justify-content: center; padding: 20px;
            `;
            modal.innerHTML = `
                <div style="background: #1a1a2e; padding: 30px; border-radius: 20px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="color: #feca57;">Category Statistics</h2>
                        <button onclick="this.closest('.modal').remove()" style="background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;">×</button>
                    </div>
                    ${statsHtml}
                </div>
            `;
            modal.className = 'modal';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            document.body.appendChild(modal);
        }

        function
        function exportData() {
            const dataStr = JSON.stringify(proverbsData, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'proverbs_export.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showError(msg) {
            document.getElementById('app').innerHTML = `<div class="error">${msg}</div>`;
        }

        // Demo mode
        if (window.location.search.includes('demo')) {
            proverbsData = [
                {
                    chapter: 1,
                    verses: "10-19",
                    text: "My son, if sinners entice thee, consent thou not...",
                    normalized_buckets: ["Integrity & Ethical Wealth", "Risk Management & Prudence"],
                    suggested_chapter: "The Foundation of True Riches",
                    principles: ["Pursuing wealth through dishonest schemes ultimately destroys."],
                    modern_applications: ["Avoid get-rich-quick schemes and fraud."],
                    sources: ["chatgpt", "gemini", "grok"]
                }
            ];
            initApp();
        }
    </script>
</body>
</html>
