<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proverbs Financial Wisdom - Complete Collection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ffd700, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p { color: #888; font-size: 1.1rem; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .btn.primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn.secondary { background: linear-gradient(135deg, #f093fb 0%, #f5576c100%); }
        .btn.success { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .search-box {
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            width: 300px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: #ffd700; }
        .stat-label { color: #888; font-size: 0.9rem; margin-top: 5px; }
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }
        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .tag:hover, .tag.active { background: #667eea; border-color: #667eea; }
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .wisdom-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .wisdom-card:hover {
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .chapter-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
        }
        .verse-ref {
            color: #888;
            font-size: 0.9rem;
        }
        .card-title {
            font-size: 1.4rem;
            color: #ffd700;
            margin-bottom: 15px;
        }
        .scripture {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            font-style: italic;
            color: #ddd;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .section { margin-top: 20px; }
        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #4ecdc4;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .section-content {
            color: #bbb;
            line-height: 1.8;
        }
        .section-content ul {
            list-style: none;
            padding-left: 0;
        }
        .section-content li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }
        .section-content li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #667eea;
        }
        .bucket-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .bucket-tag {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        .sources {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .source-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
        }
        .source-badge.chatgpt { background: rgba(16, 163, 127, 0.3); color: #10a37f; }
        .source-badge.gemini { background: rgba(66, 133, 244, 0.3); color: #4285f4; }
        .source-badge.grok { background: rgba(239, 68, 68, 0.3); color: #ef4444; }
        .hidden { display: none; }
        .toc {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .toc h3 { color: #ffd700; margin-bottom: 15px; }
        .toc-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }
        .toc-item {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .toc-item:hover { background: rgba(102, 126, 234, 0.3); }
        @media print {
            body { background: white; color: black; }
            .controls, .tags-container { display: none; }
            .wisdom-card { page-break-inside: avoid; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📖 Proverbs Financial Wisdom</h1>
        <p>
