        .unit.single { border-left: 4px solid #95a5a6; }
        
        .unit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        
        .unit-ref {
            font-size: 1.15em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .chapter-tag {
            background: #34495e;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        
        .verse-count {
            background: #c9a227;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            margin-left: 8px;
        }
        
        .unit-text {

            font-size: 1.05em;

            border-radius: 8px;
        }
        
        .secondary-cats {

            font-size: 0.9em;
        }
        
        .secondary-cat {
            background: #bdc3c7;
            color: #2c3e50;
            padding: 3px 10px;
            border-radius: 12px;
            margin-right: 6px;
            font-size: 0.85em;
        }
        
        .themes {
            margin-top: 10px;
            font-size: 0.82em;
            color: #666;
        }
        
        .theme-tag {
            background: #e8f4f8;
            color: #2980b9;
            padding: 2px 8px;
            border-radius: 8px;
            margin-right: 5px;
        }

            margin: 15px 0;

        .subcategory-suggest ul { padding-left: 20px; }
        .subcategory-suggest li { margin: 5px 0; }
        
        @media (max-width: 600px) {
            body { padding: 15px; }
            h1 { font-size: 1.5em; }

        }
