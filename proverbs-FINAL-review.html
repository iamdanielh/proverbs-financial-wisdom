<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proverbs Wisdom Units - FINAL (Fragments Fixed)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Georgia, Times, serif;
            background: #fafafa;
            color: #333;
            line-height: 1.7;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px 20px;
            margin: -20px -20px 30px -20px;
            text-align: center;
        }
        
        h1 { font-size: 1.8em; margin-bottom: 10px; }

        h3 { font-size: 1.1em; color: #34495e; margin: 30px 0 15px; }
        
        .stats {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .unit {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .unit.expanded {
            border-left: 4px solid #e74c3c;
            background: #fff5f5;
        }
        
        .unit.standalone {
            border-left: 4px solid #27ae60;
        }
        
        .unit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        
        .unit-ref {
            font-size: 1.15em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .badge.expanded {
            background: #e74c3c;
            color: white;
        }
        
        .badge.standalone {
            background: #27ae60;
            color: white;
        }
        
        .verse-count {
            background: #c9a227;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            margin-left: 8px;
        }
        
        .unit-text {
            font-family: Georgia, serif;
            font-size: 1.05em;
            line-height: 1.7;
            color: #333;
            margin: 12px 0;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        
        .primary-cat {
            background: #2c3e50;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            margin-right: 10px;
            font-weight: 600;
        }
        
        .secondary-cat {
            background: #bdc3c7;
            color: #2c3e50;
            padding: 3px 10px;
            border-radius: 12px;
            margin-right: 6px;
            font-size: 0.85em;
        }
        
        .expanded-note {
            background: #ffeaea;
            border-left: 3px solid #e74c3c;
            padding: 10px 15px;
            margin: 10px 0;
            font-size: 0.9em;
            color: #c0392b;
        }
        
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }
        
        .filter-tabs button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .filter-tabs button:hover, .filter-tabs button.active {
            background: #c9a227;
        }
        
        @media (max-width: 600px) {
            body { padding: 15px; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>

<header>
    <h1>📖 Proverbs Wisdom Units - FINAL</h1>
    <p>Fragments Fixed | 238 Units | 313 Verses | 9 Expanded Groups</p>
</header>

<div class="stats">
    <h2>📊 Summary</h2>
    <p><strong>238 Total Units</strong> covering all 243 original verses + 70 contextual verses</p>
    <p>🔴 <strong>9 units EXPANDED</strong> from fragments to complete teachings</p>
    <p>🟢 <strong>229 units PRESERVED</strong> as standalone (already complete)</p>
</div>

<div class="filter-tabs">
    <button onclick="showAll()">All Units</button>
    <button onclick="showExpanded()">🔴 Expanded Only (9)</button>
    <button onclick="showStandalone()">🟢 Standalone Only (229)</button>
</div>

<div id="content"></div>

<script>
let allUnits = [];

function loadData() {
    fetch('proverbs-wisdom-units-FINAL.json')
        .then(r => r.json())
        .then(data => {
            allUnits = data.units;
            renderUnits(allUnits);
        })
        .catch(err => {
            document.getElementById('content').innerHTML = 
                `<p style="color:red">Error loading data. Ensure proverbs-wisdom-units-FINAL.json is in the same directory.</p>
                 <p>Error: ${err.message}</p>`;
        });
}

function renderUnits(units) {
    const container = document.getElementById('content');
    
    // Group by category
    const byCat = {};
    units.forEach(u => {
        const cat = u.primary_category;
        if (!byCat[cat]) byCat[cat] = [];
        byCat[cat].push(u);
    });
    
    let html = '';
    
    Object.entries(byCat).forEach(([cat, catUnits]) => {
        const expandedCount = catUnits.filter(u => u.expanded_from && u.expanded_from.length > 0).length;
        html += `<h2>${cat} (${catUnits.length} units${expandedCount > 0 ? `, ${expandedCount} expanded` : ''})</h2>`;
        
        catUnits.forEach(u => {
            const isExpanded = u.expanded_from && u.expanded_from.length > 0;
            const className = isExpanded ? 'expanded' : 'standalone';
            const badgeClass = isExpanded ? 'expanded' : 'standalone';
            const badgeText = isExpanded ? 'EXPANDED' : 'STANDALONE';
            
            html += `
            <div class="unit ${className}">
                <div class="unit-header">
                    <span class="unit-ref">${u.reference} <span class="verse-count">${u.verse_count} verses</span></span>
                    <span class="badge ${badgeClass}">${badgeText}</span>
                </div>
                <div class="unit-text">${u.text}</div>
                <div class="categories">
                    <span class="primary-cat">${u.primary_category}</span>
                    ${(u.secondary_categories || []).map(c => `<span class="secondary-cat">${c}</span>`).join('')}
                </div>
                ${isExpanded ? `<div class="expanded-note">Expanded from fragments: ${u.expanded_from.join(', ')}</div>` : ''}
            </div>`;
        });
    });
    
    container.innerHTML = html;
}

function showAll() {
    renderUnits(allUnits);
    updateActiveButton(0);
}

function showExpanded() {
    const expanded = allUnits.filter(u => u.expanded_from && u.expanded_from.length > 0);
    const container = document.getElementById('content');
    
    let html = '<h2>🔴 EXPANDED UNITS (9 complete teachings)</h2>';
    html += '<p style="margin:15px 0; color:#666;">These were fragments that have been expanded to show complete wisdom</p>';
    
    expanded.forEach(u => {
        html += `
        <div class="unit expanded">
            <div
