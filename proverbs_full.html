k", "financial_concepts": ["Diligence & Work"]}, {"range": "11:29", "title": "inherit", "text": "He who troubles his own house shall inherit the wind. The foolish shall be servant to the wise of heart.", "summary": "Legacy & Inheritance", "financial_concepts": ["Legacy & Inheritance"]}, {"range": "12:14", "title": "work", "text": "A man shall be satisfied with good by the fruit of his mouth. The work of a man's hands shall be rewarded to him.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Profit & Exchange"]}, {"range": "12:24", "title": "diligent", "text": "The hands of the diligent ones shall rule", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "12:27", "title": "slothful", "text": "The slothful man doesn't roast his game", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "13:4", "title": "sluggard", "text": "The soul of the sluggard desires", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "14:23", "title": "work", "text": "In all hard work there is profit", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Profit & Exchange"]}, {"range": "15:19", "title": "sluggard", "text": "The way of the sluggard is like a thorn patch", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "16:26", "title": "labor", "text": "The appetite of the laboring man labors for him; for his mouth urges him on.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "17:16", "title": "money", "text": "Why is there money in the hand of a fool to buy wisdom", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions"]}, {"range": "17:18", "title": "hand", "text": "A man void of understanding strikes hands", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "18:9", "title": "work", "text": "One who is slack in his work is brother to him who is a master of destruction.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "18:20", "title": "harvest", "text": "A man's stomach is filled with the fruit of his mouth. With the harvest of his lips he is satisfied.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Provision & Need"]}, {"range": "19:15", "title": "slothful", "text": "Slothfulness casts into a deep sleep. The idle soul shall suffer hunger.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Provision & Need"]}, {"range": "19:24", "title": "sluggard", "text": "The sluggard buries his hand in the dish; he will not so much as bring it to his mouth again.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Profit & Exchange"]}, {"range": "20:4", "title": "sluggard", "text": "The sluggard will not plow by reason of the winter; therefore he shall beg in harvest", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "21:1", "title": "hand", "text": "The king's heart is in Yahweh's hand like the watercourses. He turns it wherever he desires.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "21:5", "title": "poverty", "text": "The plans of the diligent surely lead to profit; and everyone who is hasty surely rushes to poverty.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Wealth & Possessions", "Profit & Exchange"]}, {"range": "21:25", "title": "sluggard", "text": "The desire of the sluggard kills him", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "22:7", "title": "rich", "text": "The rich rule over the poor. The borrower is servant to the lender.", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions", "Debt & Lending"]}, {"range": "22:13", "title": "sluggard", "text": "The sluggard says", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "22:26", "title": "hand", "text": "Don't you be one of those who strike hands", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "22:29", "title": "work", "text": "Do you see a man skilled in his work? He will serve kings. He won't serve obscure men.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "24:27", "title": "work", "text": "Prepare your work outside", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "24:30", "title": "sluggard", "text": "I went by the field of the sluggard", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "25:13", "title": "harvest", "text": "As the cold of snow in the time of harvest", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "26:6", "title": "hand", "text": "One who sends a message by the hand of a fool is cutting off feet and drinking violence.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "26:9", "title": "hand", "text": "Like a thornbush that goes into the hand of a drunkard", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "26:13", "title": "sluggard", "text": "The sluggard says", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "26:15", "title": "lazy", "text": "The sluggard buries his hand in the dish. He is too lazy to bring it back to his mouth.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "26:16", "title": "sluggard", "text": "The sluggard is wiser in his own eyes than seven men who answer with discretion.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "26:28", "title": "work", "text": "A lying tongue hates those it hurts; and a flattering mouth works ruin.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work"]}, {"range": "27:10", "title": "house", "text": "Don't forsake your friend and your father's friend. Don't go to your brother's house in the day of your disaster: better is a neighbor who is near than a distant brother.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "28:19", "title": "poverty", "text": "One who works his land will have an abundance of food; but one who chases fantasies will have his fill of poverty.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Wealth & Possessions", "Provision & Need"]}, {"range": "30:22", "title": "food", "text": "For a servant when he is king; a fool when he is filled with food;", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "30:23", "title": "hand", "text": "for an unloved woman when she is married; and a handmaid who is heir to her mistress.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "30:28", "title": "hand", "text": "You can catch a lizard with your hands", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "31:14", "title": "bread", "text": "She is like the merchant ships. She brings her bread from afar.", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "31:18", "title": "profit", "text": "She perceives that her merchandise is profitable. Her lamp doesn't go out by night.", "summary": "Profit & Exchange", "financial_concepts": ["Profit & Exchange"]}, {"range": "31:19", "title": "hand", "text": "She lays her hands to the distaff", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "31:31", "title": "work", "text": "Give her of the fruit of her hands! Let her works praise her in the gates!", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Generosity & Giving"]}]}, {"chapter": 4, "title": "Planning: Counsel and Strategy", "section_count": 4, "color": "#455a64", "icon": "\ud83e\udeb6", "sections": [{"range": "4:10-19", "title": "General Financial Wisdom", "text": "Listen I have taught you in the way of wisdom. I have led you in straight paths. When you go Take firm hold of instruction. Don't let her go. Keep her Don't enter into the path of the wicked. Don't walk in the way of evil men. Avoid it For they don't sleep For they eat the bread of wickedness But the path of the righteous is like the dawning light The way of the wicked is like darkness. They don't know what they stumble over.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom", "Integrity & Business"]}, {"range": "20:18", "title": "wage", "text": "Plans are established by advice; by wise guidance you wage war!", "summary": "Profit & Exchange", "financial_concepts": ["Profit & Exchange"]}, {"range": "21:30", "title": "gain", "text": "There is no wisdom nor understanding nor counsel against Yahweh.", "summary": "Profit & Exchange", "financial_concepts": ["Profit & Exchange"]}, {"range": "24:6", "title": "wage", "text": "for by wise guidance you wage your war; and victory is in many advisors.", "summary": "Profit & Exchange", "financial_concepts": ["Profit & Exchange"]}]}, {"chapter": 5, "title": "Patience: No Quick Riches", "section_count": 8, "color": "#e65100", "icon": "\u26a1", "sections": [{"range": "1:10-19", "title": "Greed & Consequences", "text": "My son If they say let's swallow them up alive like Sheol We'll find all valuable wealth. We'll fill our houses with spoil. You shall cast your lot among us. We'll all have one purse. My son for their feet run to evil. They hurry to shed blood. For in vain is the net spread in the sight of any bird: but these lay wait for their own blood. They lurk secretly for their own lives. So are the ways of everyone who is greedy for gain. It takes away the life of its owners.", "summary": "Greed & Consequences", "financial_concepts": ["Greed & Consequences", "Integrity & Business"]}, {"range": "5:8", "title": "house", "text": "Remove your way far from her. Don't come near the door of her house", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "5:16", "title": "overflow", "text": "Should your springs overflow in the streets", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "5:23", "title": "lack", "text": "He will die for lack of instruction. In the greatness of his folly", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "13:11", "title": "wealth", "text": "Wealth gained dishonestly dwindles away", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions", "Integrity & Business", "Profit & Exchange"]}, {"range": "20:21", "title": "inheritance", "text": "An inheritance quickly gained at the beginning", "summary": "Legacy & Inheritance", "financial_concepts": ["Legacy & Inheritance", "Profit & Exchange"]}, {"range": "28:16", "title": "gain", "text": "A tyrannical ruler lacks judgment. One who hates ill-gotten gain will have long days.", "summary": "Profit & Exchange", "financial_concepts": ["Profit & Exchange"]}, {"range": "28:25", "title": "prosper", "text": "One who is greedy stirs up strife; but one who trusts in Yahweh will prosper.", "summary": "Greed & Consequences", "financial_concepts": ["Greed & Consequences"]}]}, {"chapter": 6, "title": "Debt: Never Sign What You Cannot Pay", "section_count": 4, "color": "#b71c1c", "icon": "\u26d3\ufe0f", "sections": [{"range": "5:10", "title": "wealth", "text": "lest strangers feast on your wealth", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions"]}, {"range": "14:10", "title": "share", "text": "The heart knows its own bitterness and joy; he will not share these with a stranger.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "20:16", "title": "pledge", "text": "Take the garment of one who puts up collateral for a stranger; and hold him in pledge for a wayward woman.", "summary": "Debt & Lending", "financial_concepts": ["Debt & Lending"]}, {"range": "20:29", "title": "lend", "text": "The glory of young men is their strength. The splendor of old men is their gray hair.", "summary": "Debt & Lending", "financial_concepts": ["Debt & Lending"]}]}, {"chapter": 7, "title": "Generosity: Give First, Receive More", "section_count": 30, "color": "#2e7d32", "icon": "\ud83d\udca7", "sections": [{"range": "1:2-6", "title": "General Financial Wisdom", "text": "to know wisdom and instruction; to discern the words of understanding; to receive instruction in wise dealing to give prudence to the simple that the wise man may hear to understand a proverb", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom", "Wisdom & Understanding"]}, {"range": "2:6", "title": "give", "text": "For Yahweh gives wisdom. Out of his mouth comes knowledge and understanding.", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "3:9-10", "title": "Generosity & Giving", "text": "Honor Yahweh with your substance so your barns will be filled with plenty", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving", "Provision & Need"]}, {"range": "3:27", "title": "withhold", "text": "Don't withhold good from those to whom it is due", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "4:1-9", "title": "General Financial Wisdom", "text": "Listen for I give you sound learning. Don't forsake my law. For I was a son to my father He taught me Get wisdom. Get understanding. Don't forget Don't forsake her Wisdom is supreme. Get wisdom. Yes Esteem her She will give to your head a garland of grace. She will deliver a crown of splendor to you.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom", "Diligence & Work"]}, {"range": "5:6", "title": "give", "text": "She gives no thought to the way of life. Her ways are crooked", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "5:9", "title": "give", "text": "lest you give your honor to others", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "6:1-5", "title": "Debt & Lending", "text": "My son You are trapped by the words of your mouth. You are ensnared with the words of your mouth. Do this now Give no sleep to your eyes Free yourself", "summary": "Debt & Lending", "financial_concepts": ["Debt & Lending", "General Financial Wisdom"]}, {"range": "7:19", "title": "home", "text": "For my husband isn't at home. He has gone on a long journey.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "8:21", "title": "wealth", "text": "That I may give wealth to those who love me. I fill their treasuries.", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions", "Generosity & Giving", "Provision & Need"]}, {"range": "11:26", "title": "withhold", "text": "People curse someone who withholds grain", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving", "Provision & Need"]}, {"range": "15:30", "title": "give", "text": "The light of the eyes rejoices the heart. Good news gives health to the bones.", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "17:4", "title": "give", "text": "An evildoer heeds wicked lips. A liar gives ear to a mischievous tongue.", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "17:8", "title": "give", "text": "A bribe is a precious stone in the eyes of him who gives it; wherever he turns", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "18:13", "title": "give", "text": "He who gives answer before he hears", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "18:16", "title": "gift", "text": "A man's gift makes room for him", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "21:14", "title": "gift", "text": "A gift in secret pacifies anger; and a bribe in the cloak", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "21:26", "title": "give", "text": "There are those who covet greedily all day long; but the righteous give and don't withhold.", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving", "Greed & Consequences"]}, {"range": "22:9", "title": "poor", "text": "He who has a generous eye will be blessed; for he shares his food with the poor.", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions", "Generosity & Giving", "Provision & Need"]}, {"range": "22:16", "title": "rich", "text": "Whoever oppresses the poor for his own increase and whoever gives to the rich", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions", "Generosity & Giving"]}, {"range": "23:6", "title": "food", "text": "Don't eat the food of him who has a stingy eye", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving", "Provision & Need"]}, {"range": "23:13", "title": "withhold", "text": "Don't withhold correction from a child. If you punish him with the rod", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "25:18", "title": "gain", "text": "A man who gives false testimony against his neighbor is like a club", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving", "Integrity & Business", "Profit & Exchange"]}, {"range": "28:27", "title": "poor", "text": "One who gives to the poor has no lack; but one who closes his eyes will have many curses.", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions", "Generosity & Giving"]}, {"range": "29:13", "title": "poor", "text": "The poor man and the oppressor have this in common: Yahweh gives sight to the eyes of both.", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions", "Generosity & Giving"]}, {"range": "29:15", "title": "give", "text": "The rod of correction gives wisdom", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "30:8", "title": "rich", "text": "Remove far from me falsehood and lies. Give me neither poverty nor riches. Feed me with the food that is needful for me;", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions", "Generosity & Giving", "Integrity & Business", "Provision & Need"]}, {"range": "30:15", "title": "give", "text": "The leach has two daughters: 'Give", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "31:3", "title": "give", "text": "Don't give your strength to women", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving"]}, {"range": "31:6", "title": "give", "text": "Give strong drink to him who is ready to perish; and wine to the bitter in soul:", "summary": "Generosity & Giving", "financial_concepts": ["Generosity & Giving", "Provision & Need"]}]}, {"chapter": 8, "title": "Reserves: Build Barns Before Need", "section_count": 14, "color": "#f57c00", "icon": "\ud83d\udce6", "sections": [{"range": "5:3", "title": "oil", "text": "For the lips of an adulteress drip honey. Her mouth is smoother than oil", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "6:8", "title": "bread", "text": "provides her bread in the summer", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "8:36", "title": "gain", "text": "But he who sins against me wrongs his own soul. All those who hate me love death.", "summary": "Profit & Exchange", "financial_concepts": ["Profit & Exchange"]}, {"range": "9:2", "title": "wine", "text": "She has prepared her meat. She has mixed her wine. She has also set her table.", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "12:11", "title": "bread", "text": "He who tills his land shall have plenty of bread", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "13:19", "title": "fill", "text": "Longing fulfilled is sweet to the soul", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "20:1", "title": "wine", "text": "Wine is a mocker", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "20:17", "title": "food", "text": "Fraudulent food is sweet to a man", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "23:20", "title": "wine", "text": "Don't be among ones drinking too much wine", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "23:31", "title": "wine", "text": "Don't look at the wine when it is red", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "27:22", "title": "grain", "text": "Though you grind a fool in a mortar with a pestle along with grain", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "27:27", "title": "food", "text": "There will be plenty of goats' milk for your food", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "28:8", "title": "wealth", "text": "He who increases his wealth by excessive interest gathers it for one who has pity on the poor.", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions"]}, {"range": "28:21", "title": "bread", "text": "To show partiality is not good; yet a man will do wrong for a piece of bread.", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}]}, {"chapter": 9, "title": "Wisdom's Value: Better Than Gold", "section_count": 6, "color": "#6a1b9a", "icon": "\ud83d\udc8e", "sections": [{"range": "6:26", "title": "bread", "text": "For a prostitute reduces you to a piece of bread. The adulteress hunts for your precious life.", "summary": "Provision & Need", "financial_concepts": ["Provision & Need"]}, {"range": "8:19", "title": "gold", "text": "My fruit is better than gold", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions"]}, {"range": "9:1", "title": "house", "text": "Wisdom has built her house. She has carved out her seven pillars.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "9:11", "title": "increase", "text": "For by me your days will be multiplied. The years of your life will be increased.", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "9:14", "title": "house", "text": "She sits at the door of her house", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "19:22", "title": "poor", "text": "That which makes a man to be desired is his kindness. A poor man is better than a liar.", "summary": "Wealth & Possessions", "financial_concepts": ["Wealth & Possessions"]}]}, {"chapter": 10, "title": "Integrity: Honest Scales", "section_count": 19, "color": "#37474f", "icon": "\u2696\ufe0f", "sections": [{"range": "2:8", "title": "just", "text": "that he may guard the paths of justice", "summary": "Integrity & Business", "financial_concepts": ["Integrity & Business"]}, {"range": "2:9", "title": "just", "text": "Then you will understand righteousness and justice", "summary": "Integrity & Business", "financial_concepts": ["Integrity & Business"]}, {"range": "6:12-19", "title": "Integrity & Business", "text": "A worthless person who winks with his eyes in whose heart is perverseness Therefore his calamity will come suddenly. He will be broken suddenly There are six things which Yahweh hates; yes haughty eyes a heart that devises wicked schemes a false witness who utters lies", "summary": "Integrity & Business", "financial_concepts": ["Integrity & Business", "Greed & Consequences"]}, {"range": "10:6", "title": "blessing", "text": "Blessings are on the head of the righteous", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "10:19", "title": "lack", "text": "In the multitude of words there is no lack of disobedience", "summary": "General Financial Wisdom", "financial_concepts": ["General Financial Wisdom"]}, {"range": "11:1", "title": "false", "text": "A false balance is an abomination to Yahweh", "summary": "Integrity & Business", "financial_concepts": ["Integrity & Business"]}, {"range": "12:5", "title": "just", "text": "The thoughts of the righteous are just", "summary": "Integrity & Business", "financial_concepts": ["Integrity & Business"]}, {"range": "16:11", "title": "work", "text": "Honest balances and scales are Yahweh's; all the weights in the bag are his work.", "summary": "Diligence & Work", "financial_concepts": ["Diligence & Work", "Integrity & Business"]}, {"range": "17:15", "title": "just", "text": "He who justifies the wicked", "summary": "Integrity & Business", "financial_concepts": ["Integrity & Business"]}, {"range": "19:5", "title": "false", "text": "A false witness shall not be unpunished. He who pours out lies shall not go free.", "summary": "Integrity & Business", "financial_concepts": ["Integrity & Business"]}, {"range": "19:9", "title": "false", "text": "A false witness shall not be unpunished. He who utters lies shall perish.", "summary": "Integrity & Business", "fina const insights = [{"chapter": 1, "headline": "Wealth needs roots before it bears fruit", "summary": "The fear of Yahweh is the beginning\u2014not destination\u2014of financial wisdom. Without this foundation, profit is a house on sand.", "key_points": ["Wisdom > Money", "Character is Capital", "Foundation First"], "proverbs_says": "Before counting money, learn to fear God. Proverbs' first lesson: foundation matters more than cash flow.", "color": "#1a237e", "icon": "\ud83c\udfdb\ufe0f"}, {"chapter": 2, "headline": "Treat labor like treasure\u2014seek it that way", "summary": "Seek wisdom as silver, search as hidden treasure. The mental model: wisdom = active pursuit = capital. Not passive.", "key_points": ["Diligence = Abundance", "Active Work", "Sow to Reap"], "proverbs_says": "You don't get wealthy; you get wisdom, and wisdom generates wealth. The search is active.", "color": "#00695c", "icon": "\u2692\ufe0f"}, {"chapter": 3, "headline": "Inaction compounds poverty", "summary": "Folded hands create debt as reliably as open hands create wealth. Poverty accumulates through neglect, not strikes.", "key_points": ["Motion > Stillness", "Avoid Folds", "Wake Up"], "proverbs_says": "Laziness mortgages your future for present ease. Poverty is behavioral failure with financial consequences.", "color": "#c62828", "icon": "\ud83d\udca4"}, {"chapter": 4, "headline": "Shortcuts destroy wisdom", "summary": "Counsel is more valuable than silver. Strategic planning precedes success. The wise consult; fools rush.", "key_points": ["Consult Widely", "Think Ahead", "Advice is Asset"], "proverbs_says": "Financial planning isn't lonely spreadsheet work\u2014it's communal wisdom. Your budget needs peer review.", "color": "#455a64", "icon": "\ud83e\udded"}, {"chapter": 5, "headline": "Hurry makes holes in pockets", "summary": "Wealth from gambling or quick gain is temporary. The one who hastens to be rich will not go unpunished.", "key_points": ["Patience > Speed", "Greed Self-Destructs", "Sustainable > Fast"], "proverbs_says": "Speed is the enemy of sustainability. Don't get rich fast\u2014the tortoise beats the hare in finance too.", "color": "#e65100", "icon": "\u26a1"}, {"chapter": 6, "headline": "Never sign what you can't pay", "summary": "Debt is a snare. Co-signing is explicitly warned. The borrower becomes servant to the lender. Free yourself.", "key_points": ["Debt = Bondage", "Avoid Surety", "Escape Early"], "proverbs_says": "Co-signing guarantees another's irresponsibility. Your signature enslaves you to their choices.", "color": "#b71c1c", "icon": "\u26d3\ufe0f"}, {"chapter": 7, "headline": "Give first, receive more", "summary": "Honor Yahweh with substance\u2014not surplus. Firstfruits unlock overflow. Generosity is physics, not charity.", "key_points": ["Firstfruits Principle", "Generosity Multiplies", "Open Hand"], "proverbs_says": "Give first, receive more. The universe honors generosity\u2014barns overflow to the giver.", "color": "#2e7d32", "icon": "\ud83d\udca7"}, {"chapter": 8, "headline": "Build barns before you need them", "summary": "The wise store up choice food; fools devour everything. Wealth requires delayed gratification and reserves.", "key_points": ["Build Reserves", "Delay Gratification", "Storage Matters"], "proverbs_says": "Wealth is built slowly, then suddenly. The barns of the diligent have surplus.", "color": "#f57c00", "icon": "\ud83d\udce6"}, {"chapter": 9, "headline": "Wisdom > Gold by every metric", "summary": "Silver, gold, rubies\u2014all valuable, but wisdom more so. Get wisdom though it costs all you have.", "key_points": ["Wisdom is Premium", "Prioritize Correctly", "ROI is Eternal"], "proverbs_says": "Most value wealth over wisdom. Proverbs corrects this: wisdom produces wealth, not vice versa.", "color": "#6a1b9a", "icon": "\ud83d\udc8e"}, {"chapter": 10, "headline": "False scales are discovered", "summary": "Just weights please God. Dishonest gain is ill-gotten and short-lived. Integrity in business is non-negotiable.", "key_points": ["Integrity Pays", "Deceit Fails", "Just Dealing"], "proverbs_says": "Dishonest money dwindles. The just balance is found out\u2014so use it from the start.", "color": "#37474f", "icon": "\u2696\ufe0f"}, {"chapter": 11, "headline": "Wealth transfers; character compounds", "summary": "A good name is more valuable than riches. Train children young. You steward for the next generation.", "key_points": ["Name > Money", "Train Children", "Think Generations"], "proverbs_says": "The house of the righteous stands. Build a lasting name, not just a bank account.", "color": "#5d4037", "icon": "\ud83c\udf33"}, {"chapter": 12, "headline": "Pay promptly; work faithfully", "summary": "The laborer is worthy of hire. Withhold not wages overnight. The worker deserves fair compensation.", "key_points": ["Prompt Payment", "Labor Reward", "Fairness"], "proverbs_says": "Don't sleep while workers wait for pay. Fair wages given quickly build trust and honor.", "color": "#00796b", "icon": "\ud83d\udcb5"}];
let current = 0;

function init() {
    let nav = '<button class="nav-btn active" onclick="show(0)">All</button>';
    book.chapters.forEach((c,i) => nav += '<button class="nav-btn" onclick="show('+(i+1)+')">'+(i+1)+'</button>');
    document.getElementById('nav').innerHTML = nav;
    render();
    document.getElementById('search').addEventListener('input', render);
}

function show(n) {
    current = n;
    document.querySelectorAll('.nav-btn').forEach((b,i) => b.classList.toggle('active', i===n));
    render();
}

function render() {
    const s = document.getElementById('search').value.toLowerCase();
    let h = '';
    const chs = current === 0 ? book.chapters : [book.chapters[current-1]];
    
    chs.forEach((ch, idx) => {
        const cn = current === 0 ? ch.chapter : current;
        const ins = insights.find(i => i.chapter === cn);
        h += '<div class="chapter-card">';
        h += '<div class="chapter-header" style="background:'+(ins?ins.color:'#1a237e')+'">';
        h += '<div class="chapter-icon">'+(ins?ins.icon:'📖')+'</div>';
        h += '<div class="chapter-title">Chapter '+ch.chapter+': '+ch.title+'</div>';
        h += '</div><div class="chapter-body">';
        if(ins) {
            h += '<div class="insight-box" style="border-color:'+ins.color+'">';
            h += '<strong>💡 '+ins.headline+'</strong><br>'+ins.summary;
            h += '</div>';
        }
        h += '<p style="margin-bottom:1rem;color:#666">'+ch.section_count+' sections</p>';
        
        const fil = ch.sections.filter(sec => {
            if(!s) return true;
            return sec.text.toLowerCase().includes(s) || sec.concepts.some(c=>c.toLowerCase().includes(s));
        });
        
        fil.forEach(sec => {
            h += '<div class="verse-section">';
            h += '<div class="verse-header">';
            h += '<span style="font-weight:600">'+sec.title+'</span>';
            h += '<span class="verse-range">'+sec.range+'</span></div>';
            h += '<div class="verse-text">'+sec.text+'</div>';
            h += '<div style="margin-top:0.5rem">';
            sec.financial_concepts.forEach(c => h += '<span class="concept-tag">'+c+'</span>');
            h += '</div></div>';
        });
        h += '</div></div>';
    });
    document.getElementById('content').innerHTML = h || '<p style="color:white;text-align:center">No results</p>';
}

init();
</script>
