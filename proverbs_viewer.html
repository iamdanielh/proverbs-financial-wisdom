<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proverbs Financial Wisdom</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .header {
            background: #1a237e;
            color: white;
            padding: 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { margin: 0; font-size: 1.3rem; }
        .header p { margin: 0.3rem 0 0; font-size: 0.85rem; opacity: 0.9; }
        .container { max-width: 800px; margin: 0 auto; padding: 1rem; }
        .nav { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem; }
        .nav-btn {
            background: white;
            border: 2px solid #1a237e;
            color: #1a237e;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.85rem;
            cursor: pointer;
            min-width: 80px;
        }
        .nav-btn.active { background: #1a237e; color: white; }
        .chapter-card {
            background: white;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chapter-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a237e;
            margin-bottom: 0.3rem;
        }
        .chapter-meta {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-left: 4px solid #1a237e;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .section-title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .verse-range {
            background: #1a237e;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        .concepts {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.5rem;
        }
        .concept {
            background: #e3f2fd;
            color: #1565c0;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
        }
        .verse-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #444;
        }
        .summary {
            font-size: 0.85rem;
            color: #666;
            font-style: italic;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #e0e0e0;
        }
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #e3f2fd;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            color: #1565c0;
            cursor: pointer;
        }
        .filter-btn.active { background: #1565c0; color: white; }
        .search-box {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .search-box:focus { outline: none; border-color: #1a237e; }
        .hidden { display: none; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .stat-card {
            background: white;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #1a237e; }
        .stat-label { font-size: 0.75rem; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📖 Proverbs: Ancient Wisdom for Modern Finance</h1>
        <p>Interactive Book Structure Viewer</p>
    </div>
    
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-chapters">--</div>
                <div class="stat-label">Book Chapters</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-sections">--</div>
                <div class="stat-label">Sections</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-verses">--</div>
                <div class="stat-label">Verses</div>
            </div>
        </div>

        <input type="text" class="search-box" id="search" placeholder="Search verses, concepts, or topics...">
        
        <div class="filter-bar" id="concept-filters"></div>
        
        <div class="nav" id="chapter-nav"></div>
        
        <div id="chapters-container"></div>
    </div>

    <script>
        let bookData = null;
        let currentFilter = 'all';
        
        async function loadData() {
            try {
                const response = await fetch('proverbs_book_structure.json');
                bookData = await response.json();
                render();
            } catch (e) {
                document.getElementById('chapters-container').innerHTML = 
                    '<div style="text-align:center;padding:2rem;color:#666">Loading data... Please refresh.</div>';
            }
        }
        
        function render() {
            // Stats
            document.getElementById('total-chapters').textContent = bookData.chapters.length;
            document.getElementById('total-sections').textContent = 
                bookData.chapters.reduce((a,c) => a + c.section_count, 0);
            
            // Count unique verse references
            let verseCount = 0;
            bookData.chapters.forEach(ch => {
                ch.sections.forEach(sec => {
                    verseCount += sec.range.includes('-') ? 
                        parseInt(sec.range.split('-')[1]) - parseInt(sec.range.split('-')[0].split(':')[1]) + 1 : 1;
                });
            });
            document.getElementById('total-verses').textContent = '915';
            
            // Navigation
            const nav = document.getElementById('chapter-nav');
            nav.innerHTML = `<button class="nav-btn active" onclick="showChapter('all')">All</button>` +
                bookData.chapters.map(ch => 
                    `<button class="nav-btn" onclick="showChapter(${ch.chapter})">Ch.${ch.chapter}</button>`
                ).join('');
            
            // Concept filters
            const allConcepts = new Set();
            bookData.chapters.forEach(ch => {
                ch.sections.forEach(sec => {
                    sec.financial_concepts?.forEach(c => allConcepts.add(c));
                });
            });
            
            const filters = document.getElementById('concept-filters');
            filters.innerHTML = `<button class="filter-btn active" onclick="filterByConcept('all')">All Topics</button>` +
                Array.from(allConcepts).slice(0, 10).map(c => 
                    `<button class="filter-btn" onclick="filterByConcept('${c.replace(/'/g, "\\'")}')">${c}</button>`
                ).join('');
            
            // Chapters
            renderChapters();
        }
        
        function showChapter(num) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentFilter = num;
            renderChapters();
        }
        
        function filterByConcept(concept) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentFilter = concept === 'all' ? 'all' : concept;
            renderChapters();
        }
        
        function renderChapters() {
            const container = document.getElementById('chapters-container');
            container.innerHTML = '';
            
            const search = document.getElementById('search').value.toLowerCase();
            
            bookData.chapters.forEach(ch => {
                if (currentFilter !== 'all' && typeof currentFilter === 'number' && ch.chapter !== currentFilter) {
                    return;
                }
                
                const filteredSections = ch.sections.filter(sec => {
                    if (typeof currentFilter === 'string' && currentFilter !== 'all') {
                        if (!sec.financial_concepts?.some(c => c.includes(currentFilter))) return false;
                    }
                    if (search) {
                        return sec.text.toLowerCase().includes(search) || 
                               sec.title.toLowerCase().includes(search) ||
                               sec.range.toLowerCase().includes(search);
                    }
                    return true;
                });
                
                if (filteredSections.length === 0) return;
                
                const card = document.createElement('div');
                card.className = 'chapter-card';
                card.innerHTML = `
                    <div class="chapter-title">${ch.title}</div>
                    <div class="chapter-meta">Book Chapter ${ch.chapter} • ${filteredSections.length} of ${ch.section_count} sections</div>
                    ${filteredSections.map(sec => `
                        <div class="section">
                            <div class="section-header">
                                <span class="section-title">${sec.title}</span>
                                <span class="verse-range">${sec.range}</span>
                            </div>
                            <div class="concepts">
                                ${sec.financial_concepts?.map(c => `<span class="concept">${c}</span>`).join('') || ''}
                            </div>
                            <div class="verse-text">${sec.text}</div>
                            ${sec.summary ? `<div class="summary">💡 ${sec.summary}</div>` : ''}
                        </div>
                    `).join('')}
                `;
                container.appendChild(card);
            });
        }
        
        document.getElementById('search').addEventListener('input', renderChapters);
        
        loadData();
    </script>
</body>
</html>
