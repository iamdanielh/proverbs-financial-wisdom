    <script>
        const insights = [{"chapter": 1, "headline": "Wealth needs roots before it bears fruit", "summary": "The fear of Yahweh is the beginning\u2014not destination\u2014of financial wisdom. Without this foundation, profit is a house on sand.", "key_points": ["Wisdom > Money", "Character is Capital", "Foundation First"], "proverbs_says": "Before counting money, learn to fear God. Proverbs' first lesson: foundation matters more than cash flow.", "color": "#1a237e", "icon": "\ud83c\udfdb\ufe0f"}, {"chapter": 2, "headline": "Treat labor like treasure\u2014seek it that way", "summary": "Seek wisdom as silver, search as hidden treasure. The mental model: wisdom = active pursuit = capital. Not passive.", "key_points": ["Diligence = Abundance", "Active Work", "Sow to Reap"], "proverbs_says": "You don't get wealthy; you get wisdom, and wisdom generates wealth. The search is active.", "color": "#00695c", "icon": "\u2692\ufe0f"}, {"chapter": 3, "headline": "Inaction compounds poverty", "summary": "Folded hands create debt as reliably as open hands create wealth. Poverty accumulates through neglect, not strikes.", "key_points": ["Motion > Stillness", "Avoid Folds", "Wake Up"], "proverbs_says": "Laziness mortgages your future for present ease. Poverty is behavioral failure with financial consequences.", "color": "#c62828", "icon": "\ud83d\udca4"}, {"chapter": 4, "headline": "Shortcuts destroy wisdom", "summary": "Counsel is more valuable than silver. Strategic planning precedes success. The wise consult; fools rush.", "key_points": ["Consult Widely", "Think Ahead", "Advice is Asset"], "proverbs_says": "Financial planning isn't lonely spreadsheet work\u2014it's communal wisdom. Your budget needs peer review.", "color": "#455a64", "icon": "\ud83e\udded"}, {"chapter": 5, "headline": "Hurry makes holes in pockets", "summary": "Wealth from gambling or quick gain is temporary. The one who hastens to be rich will not go unpunished.", "key_points": ["Patience > Speed", "Greed Self-Destructs", "Sustainable > Fast"], "proverbs_says": "Speed is the enemy of sustainability. Don't get rich fast\u2014the tortoise beats the hare in finance too.", "color": "#e65100", "icon": "\u26a1"}, {"chapter": 6, "headline": "Never sign what you can't pay", "summary": "Debt is a snare. Co-signing is explicitly warned. The borrower becomes servant to the lender. Free yourself.", "key_points": ["Debt = Bondage", "Avoid Surety", "Escape Early"], "proverbs_says": "Co-signing guarantees another's irresponsibility. Your signature enslaves you to their choices.", "color": "#b71c1c", "icon": "\u26d3\ufe0f"}, {"chapter": 7, "headline": "Give first, receive more", "summary": "Honor Yahweh with substance\u2014not surplus. Firstfruits unlock overflow. Generosity is physics, not charity.", "key_points": ["Firstfruits Principle", "Generosity Multiplies", "Open Hand"], "proverbs_says": "Give first, receive more. The universe honors generosity\u2014barns overflow to the giver.", "color": "#2e7d32", "icon": "\ud83d\udca7"}, {"chapter": 8, "headline": "Build barns before you need them", "summary": "The wise store up choice food; fools devour everything. Wealth requires delayed gratification and reserves.", "key_points": ["Build Reserves", "Delay Gratification", "Storage Matters"], "proverbs_says": "Wealth is built slowly, then suddenly. The barns of the diligent have surplus.", "color": "#f57c00", "icon": "\ud83d\udce6"}, {"chapter": 9, "headline": "Wisdom > Gold by every metric", "summary": "Silver, gold, rubies\u2014all valuable, but wisdom more so. Get wisdom though it costs all you have.", "key_points": ["Wisdom is Premium", "Prioritize Correctly", "ROI is Eternal"], "proverbs_says": "Most value wealth over wisdom. Proverbs corrects this: wisdom produces wealth, not vice versa.", "color": "#6a1b9a", "icon": "\ud83d\udc8e"}, {"chapter": 10, "headline": "False scales are discovered", "summary": "Just weights please God. Dishonest gain is ill-gotten and short-lived. Integrity in business is non-negotiable.", "key_points": ["Integrity Pays", "Deceit Fails", "Just Dealing"], "proverbs_says": "Dishonest money dwindles. The just balance is found out\u2014so use it from the start.", "color": "#37474f", "icon": "\u2696\ufe0f"}, {"chapter": 11, "headline": "Wealth transfers; character compounds", "summary": "A good name is more valuable than riches. Train children young. You steward for the next generation.", "key_points": ["Name > Money", "Train Children", "Think Generations"], "proverbs_says": "The house of the righteous stands. Build a lasting name, not just a bank account.", "color": "#5d4037", "icon": "\ud83c\udf33"}, {"chapter": 12, "headline": "Pay promptly; work faithfully", "summary": "The laborer is worthy of hire. Withhold not wages overnight. The worker deserves fair compensation.", "key_points": ["Prompt Payment", "Labor Reward", "Fairness"], "proverbs_says": "Don't sleep while workers wait for pay. Fair wages given quickly build trust and honor.", "color": "#00796b", "icon": "\ud83d\udcb5"}];
        const book = {"book_title": "Proverbs: Financial Wisdom by Chapter", "chapters": [{"chapter": 1, "title": "Chapter 1: The Foundation of Wisdom", "section_count": 3, "sections": [{"range": "1:2-6", "title": "Financial Wisdom", "text": "to know wisdom and instruction; to discern the words of understanding; to receive instruction in wise dealing to give prudence to the simple that the wise man may hear to understand a proverb", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom", "wisdom/understanding"]}, {"range": "1:10-19", "title": "Financial Wisdom", "text": "My son If they say let's swallow them up alive like Sheol We'll find all valuable wealth. We'll fill our houses with spoil. You shall cast your lot among us. We'll all have one purse. My son for their feet run to evil. They hurry to shed blood. For in vain is the net spread in the sight of any bird: but these lay wait for their own blood. They lurk secretly for their own lives. So are the ways of everyone who is greedy for gain. It takes away the life of its owners.", "summary": "Thematic unit on Greed & Consequences", "financial_concepts": ["greed/consequences", "integrity/business"]}, {"range": "1:30", "title": "want", "text": "They wanted none of my counsel. They despised all my reproof.", "summary": "Thematic unit on Provision & Need", "financial_concepts": ["provision/need"]}]}, {"chapter": 2, "title": "Chapter 2: Seek Wisdom as Treasure", "section_count": 6, "sections": [{"range": "2:4", "title": "silver", "text": "If you seek her as silver", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "2:6", "title": "give", "text": "For Yahweh gives wisdom. Out of his mouth comes knowledge and understanding.", "summary": "Thematic unit on Generosity & Giving", "financial_concepts": ["generosity/giving"]}, {"range": "2:8", "title": "just", "text": "that he may guard the paths of justice", "summary": "Thematic unit on Integrity & Business", "financial_concepts": ["integrity/business"]}, {"range": "2:9", "title": "just", "text": "Then you will understand righteousness and justice", "summary": "Thematic unit on Integrity & Business", "financial_concepts": ["integrity/business"]}, {"range": "2:18", "title": "house", "text": "for her house leads down to death", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "2:19", "title": "gain", "text": "None who go to her return again", "summary": "Thematic unit on Profit & Exchange", "financial_concepts": ["profit/exchange"]}]}, {"chapter": 3, "title": "Chapter 3: Trust and Honor", "section_count": 7, "sections": [{"range": "3:9-10", "title": "Financial Wisdom", "text": "Honor Yahweh with your substance so your barns will be filled with plenty", "summary": "Thematic unit on Generosity & Giving", "financial_concepts": ["generosity/giving", "provision/need"]}, {"range": "3:14", "title": "silver", "text": "For her good profit is better than getting silver", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions", "profit/exchange"]}, {"range": "3:16", "title": "rich", "text": "Length of days is in her right hand. In her left hand are riches and honor.", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "3:27", "title": "withhold", "text": "Don't withhold good from those to whom it is due", "summary": "Thematic unit on Generosity & Giving", "financial_concepts": ["generosity/giving"]}, {"range": "3:29", "title": "gain", "text": "Don't devise evil against your neighbor", "summary": "Thematic unit on Profit & Exchange", "financial_concepts": ["profit/exchange"]}, {"range": "3:33", "title": "house", "text": "Yahweh's curse is in the house of the wicked", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "3:35", "title": "inherit", "text": "The wise will inherit glory", "summary": "Thematic unit on Legacy & Inheritance", "financial_concepts": ["legacy/inheritance"]}]}, {"chapter": 4, "title": "Chapter 4: Guard Your Heart", "section_count": 3, "sections": [{"range": "4:1-9", "title": "Financial Wisdom", "text": "Listen for I give you sound learning. Don't forsake my law. For I was a son to my father He taught me Get wisdom. Get understanding. Don't forget Don't forsake her Wisdom is supreme. Get wisdom. Yes Esteem her She will give to your head a garland of grace. She will deliver a crown of splendor to you.", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom", "diligence/work"]}, {"range": "4:10-19", "title": "Financial Wisdom", "text": "Listen I have taught you in the way of wisdom. I have led you in straight paths. When you go Take firm hold of instruction. Don't let her go. Keep her Don't enter into the path of the wicked. Don't walk in the way of evil men. Avoid it For they don't sleep For they eat the bread of wickedness But the path of the righteous is like the dawning light The way of the wicked is like darkness. They don't know what they stumble over.", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom", "integrity/business"]}, {"range": "4:20-27", "title": "Financial Wisdom", "text": "My son Let them not depart from your eyes. Keep them in the midst of your heart. For they are life to those who find them Keep your heart with all diligence Put away from yourself a perverse mouth. Put corrupt lips far from you. Let your eyes look straight ahead. Fix your gaze directly before you. Make the path of your feet level. Let all of your ways be established. Don't turn to the right hand nor to the left. Remove your foot from evil.", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}]}, {"chapter": 5, "title": "Chapter 5: Avoid the Seductress", "section_count": 7, "sections": [{"range": "5:3", "title": "oil", "text": "For the lips of an adulteress drip honey. Her mouth is smoother than oil", "summary": "Thematic unit on Provision & Need", "financial_concepts": ["provision/need"]}, {"range": "5:6", "title": "give", "text": "She gives no thought to the way of life. Her ways are crooked", "summary": "Thematic unit on Generosity & Giving", "financial_concepts": ["generosity/giving"]}, {"range": "5:8", "title": "house", "text": "Remove your way far from her. Don't come near the door of her house", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "5:9", "title": "give", "text": "lest you give your honor to others", "summary": "Thematic unit on Generosity & Giving", "financial_concepts": ["generosity/giving"]}, {"range": "5:10", "title": "wealth", "text": "lest strangers feast on your wealth", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "5:16", "title": "overflow", "text": "Should your springs overflow in the streets", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "5:23", "title": "lack", "text": "He will die for lack of instruction. In the greatness of his folly", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}]}, {"chapter": 6, "title": "Chapter 6: Warnings and Instructions", "section_count": 5, "sections": [{"range": "6:1-5", "title": "Financial Wisdom", "text": "My son You are trapped by the words of your mouth. You are ensnared with the words of your mouth. Do this now Give no sleep to your eyes Free yourself", "summary": "Thematic unit on Debt & Lending", "financial_concepts": ["debt/lending", "general_financial_wisdom"]}, {"range": "6:12-19", "title": "Financial Wisdom", "text": "A worthless person who winks with his eyes in whose heart is perverseness Therefore his calamity will come suddenly. He will be broken suddenly There are six things which Yahweh hates; yes haughty eyes a heart that devises wicked schemes a false witness who utters lies", "summary": "Thematic unit on Integrity & Business", "financial_concepts": ["integrity/business", "greed/consequences"]}, {"range": "6:8", "title": "bread", "text": "provides her bread in the summer", "summary": "Thematic unit on Provision & Need", "financial_concepts": ["provision/need"]}, {"range": "6:11", "title": "poverty", "text": "so your poverty will come as a robber", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "6:26", "title": "bread", "text": "For a prostitute reduces you to a piece of bread. The adulteress hunts for your precious life.", "summary": "Thematic unit on Provision & Need", "financial_concepts": ["provision/need"]}]}, {"chapter": 7, "title": "Chapter 7: The Crafty Harlot", "section_count": 3, "sections": [{"range": "7:1-27", "title": "Financial Wisdom", "text": "My son Keep my commandments and live! Guard my teaching as the apple of your eye. Bind them on your fingers. Write them on the tablet of your heart. Tell wisdom that they may keep you from the strange woman For at the window of my house I saw among the simple ones. I discerned among the youths a young man void of understanding passing through the street near her corner in the twilight Behold She is loud and defiant. Her feet don't stay in her house. Now she is in the streets So she caught him Sacrifices of peace offerings are with me. This day I have paid my vows. Therefore I came out to meet you I have spread my couch with carpets of tapestry I have perfumed my bed with myrrh Come For my husband isn't at home. He has gone on a long journey. He has taken a bag of money with him. He will come home at the full moon. With persuasive words He followed her immediately Until an arrow strikes through his liver Now therefore Don't let your heart turn to her ways. Don't go astray in her paths for she has thrown down many wounded. Yes Her house is the way to Sheol", "summary": "Thematic unit on Integrity & Business", "financial_concepts": ["integrity/business"]}, {"range": "7:19", "title": "home", "text": "For my husband isn't at home. He has gone on a long journey.", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "7:20", "title": "money", "text": "He has taken a bag of money with him. He will come home at the full moon.", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}]}, {"chapter": 8, "title": "Chapter 8: Wisdom Calls Out", "section_count": 7, "sections": [{"range": "8:10", "title": "silver", "text": "Receive my instruction rather than silver; knowledge rather than choice gold.", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "8:17", "title": "diligent", "text": "I love those who love me. Those who seek me diligently will find me.", "summary": "Thematic unit on Diligence & Work", "financial_concepts": ["diligence/work"]}, {"range": "8:18", "title": "rich", "text": "With me are riches", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "8:19", "title": "gold", "text": "My fruit is better than gold", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "8:21", "title": "wealth", "text": "That I may give wealth to those who love me. I fill their treasuries.", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions", "generosity/giving", "provision/need"]}, {"range": "8:22", "title": "work", "text": "Yahweh possessed me in the beginning of his work", "summary": "Thematic unit on Diligence & Work", "financial_concepts": ["diligence/work"]}, {"range": "8:36", "title": "gain", "text": "But he who sins against me wrongs his own soul. All those who hate me love death.", "summary": "Thematic unit on Profit & Exchange", "financial_concepts": ["profit/exchange"]}]}, {"chapter": 9, "title": "Chapter 9: Two Banquets", "section_count": 5, "sections": [{"range": "9:1", "title": "house", "text": "Wisdom has built her house. She has carved out her seven pillars.", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "9:2", "title": "wine", "text": "She has prepared her meat. She has mixed her wine. She has also set her table.", "summary": "Thematic unit on Provision & Need", "financial_concepts": ["provision/need"]}, {"range": "9:11", "title": "increase", "text": "For by me your days will be multiplied. The years of your life will be increased.", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "9:14", "title": "house", "text": "She sits at the door of her house", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "9:17", "title": "food", "text": "Stolen water is sweet. Food eaten in secret is pleasant.", "summary": "Thematic unit on Provision & Need", "financial_concepts": ["provision/need"]}]}, {"chapter": 10, "title": "Chapter 10: The Way of Righteousness", "section_count": 8, "sections": [{"range": "10:2", "title": "treasure", "text": "Treasures of wickedness profit nothing", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions", "profit/exchange"]}, {"range": "10:4", "title": "poor", "text": "He becomes poor who works with a lazy hand", "summary": "Thematic unit on Diligence & Work", "financial_concepts": ["diligence/work", "wealth/possessions"]}, {"range": "10:6", "title": "blessing", "text": "Blessings are on the head of the righteous", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "10:15", "title": "wealth", "text": "The rich man's wealth is his strong city. The destruction of the poor is their poverty.", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "10:16", "title": "labor", "text": "The labor of the righteous leads to life. The increase of the wicked leads to sin.", "summary": "Thematic unit on Diligence & Work", "financial_concepts": ["diligence/work"]}, {"range": "10:19", "title": "lack", "text": "In the multitude of words there is no lack of disobedience", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "10:20", "title": "silver", "text": "The tongue of the righteous is like choice silver. The heart of the wicked is of little worth.", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}, {"range": "10:22", "title": "wealth", "text": "Yahweh's blessing brings wealth", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions"]}]}, {"chapter": 11, "title": "Chapter 11: Honest Scales", "section_count": 9, "sections": [{"range": "11:1", "title": "false", "text": "A false balance is an abomination to Yahweh", "summary": "Thematic unit on Integrity & Business", "financial_concepts": ["integrity/business"]}, {"range": "11:4", "title": "rich", "text": "Riches don't profit in the day of wrath", "summary": "Thematic unit on Wealth & Possessions", "financial_concepts": ["wealth/possessions", "profit/exchange"]}, {"range": "11:11", "title": "blessing", "text": "By the blessing of the upright", "summary": "Thematic unit on General Financial Wisdom", "financial_concepts": ["general_financial_wisdom"]}, {"range": "11:18", "title": "wage", "text": "Wicked people earn deceitful wages", "summary": "Thematic unit on Profit &             const nav = document.getElementById("nav");
            nav.innerHTML = '<button class="nav-btn active" onclick="showChapter(0)">📊 All</button>' + 
                insights.map(i => '<button class="nav-btn" onclick="showChapter('+i.chapter+')">'+i.chapter+'</button>').join("");
            render();
            document.getElementById("search").addEventListener("input", render);
        }
        
        function showChapter(n) {
            currentChapter = n;
            document.querySelectorAll(".nav-btn").forEach((b,i) => b.classList.toggle("active", i===n));
            render();
        }
        
        function render() {
            const search = document.getElementById("search").value.toLowerCase();
            const container = document.getElementById("content");
            let html = "";
            
            const chapters = currentChapter === 0 ? book.chapters : [book.chapters[currentChapter-1]];
            
            chapters.forEach((ch, idx) => {
                const chapNum = currentChapter === 0 ? idx + 1 : currentChapter;
                const insight = insights.find(i => i.chapter === chapNum);
                
                if (insight) {
                    html += '<div class="insight-card">' +
                        '<div class="insight-header" style="background: '+insight.color+'">' +
                            '<div class="insight-icon">'+insight.icon+'</div>' +
                            '<div class="insight-chapter">Chapter '+insight.chapter+'</div>' +
                            '<div class="insight-headline">'+insight.headline+'</div>' +
                        '</div>' +
                        '<div class="insight-body">' +
                            '<div class="insight-summary">'+insight.summary+'</div>' +
                            '<div class="insight-proverbs" style="border-color: '+insight.color+'"><strong>Proverbs Says:</strong> '+insight.proverbs_says+'</div>' +
                            '<div class="key-points">'+insight.key_points.map(p => '<span class="key-point">'+p+'</span>').join("")+'</div>' +
                        '</div></div>';
                }
                
                const filtered = ch.sections.filter(s => {
                    if (!s.financial_concepts || s.financial_concepts.length === 0) return false;
                    if (!search) return true;
                    return s.text.toLowerCase().includes(search) || s.title.toLowerCase().includes(search) || s.financial_concepts.some(c => c.toLowerCase().includes(search));
                });
                
                filtered.forEach(s => {
                    html += '<div class="verse-section">' +
                        '<div class="verse-header">' +
                            '<span class="verse-title">'+s.title+'</span>' +
                            '<span class="verse-range">'+s.range+'</span>' +
                        '</div>' +
                        '<div class="verse-text">'+s.text+'</div>' +
                        '<div class="verse-concepts">'+s.financial_concepts.map(c => '<span class="concept-tag">'+c+'</span>').join("")+'</div>' +
                    '</div>';
                });
            });
            
            container.innerHTML = html || "<p style='color:white;text-align:center;padding:2rem'>No results found</p>";
        }
        
        init();
    </script>
</body>
</html>
