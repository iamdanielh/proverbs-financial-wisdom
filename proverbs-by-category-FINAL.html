<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proverbs - By Category</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Georgia, serif; background: #fafafa; color: #333; line-height: 1.7; padding: 20px; }
        header { background: #2c3e50; color: white; padding: 30px 20px; margin: -20px -20px 30px -20px; text-align: center; }
        h1 { font-size: 1.8em; }
        h2 { font-size: 1.3em; margin: 30px 0 15px; color: #2c3e50; border-bottom: 3px solid #c9a227; padding-bottom: 10px; }
        h3 { font-size: 1.1em; color: #34495e; margin: 25px 0 10px; }
        .unit { background: white; border-radius: 8px; padding: 15px; margin: 10px 0; border-left: 3px solid #c9a227; }
        .unit.expanded { border-left-color: #e74c3c; background: #fff5f5; }
        .unit.standalone { border-left-color: #27ae60; }
        .unit-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
        .unit-ref { font-weight: bold; color: #2c3e50; }
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.7em; margin-left: 8px; }
        .badge.expanded { background: #e74c3c; color: white; }
        .badge.standalone { background: #27ae60; color: white; }
        .unit-text { margin: 10px 0; padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .primary-cat { background: #2c3e50; color: white; padding: 3px 10px; border-radius: 15px; font-size: 0.85em; }
        .stats { background: #ecf0f1; padding: 20px; border-radius: 10px; margin: 20px 0; }
        
        /* Navigation Styles */
        .category-nav { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .category-nav a { background: #2c3e50; color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; cursor: pointer; transition: background 0.2s; }
        .category-nav a:hover { background: #c9a227; }
        .category-nav a.active { background: #c9a227; font-weight: bold; } /* Active filter state */
        
        /* Section wrapper for filtering */
        .category-section { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <h1>Proverbs Wisdom - By Category</h1>
    <p id="subtitle">Loading units...</p>
</header>

<div id="top-stats" class="stats">
    <strong>Calculating stats...</strong>
</div>

<div id="categories-nav" class="category-nav"></div>

<div id="content"></div>

<script>
const unitsByCategory = {};

// Global Filter Function
window.filterCategory = function(safeId, event) {
    event.preventDefault(); // Prevents page from jumping to top
    
    // Update active state on buttons
    document.querySelectorAll('.category-nav a').forEach(a => a.classList.remove('active'));
    event.target.classList.add('active');
    
    // Show/Hide sections
    document.querySelectorAll('.category-section').forEach(section => {
        if (safeId === 'all') {
            section.style.display = 'block';
        } else {
            if (section.id === 'section-' + safeId) {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }
    });
};

fetch('https://raw.githubusercontent.com/iamdanielh/proverbs-financial-wisdom/main/proverbs-wisdom-units-FINAL.json')
    .then(r => r.json())
    .then(data => {
        let expandedTotal = 0;
        let standaloneTotal = 0;
        const totalUnits = data.units.length;

        // Group by primary category and tally stats
        data.units.forEach(u => {
            const cat = u.primary_category;
            if (!unitsByCategory[cat]) unitsByCategory[cat] = [];
            unitsByCategory[cat].push(u);

            // Count expanded vs standalone dynamically
            if (u.expanded_from && u.expanded_from.length) {
                expandedTotal++;
            } else {
                standaloneTotal++;
            }
        });
        
        // Render dynamic header stats
        document.getElementById('subtitle').innerText = `${totalUnits} Units Organized by Primary Category`;
        document.getElementById('top-stats').innerHTML = `<strong>${totalUnits} Total Units</strong> | 🔴 ${expandedTotal} Expanded | 🟢 ${standaloneTotal} Standalone`;

        // Render navigation
        const nav = document.getElementById('categories-nav');
        nav.innerHTML += `<a href="#" class="active" onclick="filterCategory('all', event)">All Categories</a>`; // Added 'All' Button
        
        Object.keys(unitsByCategory).sort().forEach(cat => {
            const count = unitsByCategory[cat].length;
            const safeId = cat.replace(/\s+/g, '-');
            nav.innerHTML += `<a href="#" onclick="filterCategory('${safeId}', event)">${cat} (${count})</a>`;
        });
        
        // Render content
        const content = document.getElementById('content');
        Object.entries(unitsByCategory).sort().forEach(([cat, units]) => {
            const safeId = cat.replace(/\s+/g, '-');
            const expandedCount = units.filter(u => u.expanded_from && u.expanded_from.length).length;
            
            // Start a wrapper div for the entire category
            let catHTML = `<div class="category-section" id="section-${safeId}">`;
            
            catHTML += `<h2 id="${safeId}">${cat} (${units.length} units${expandedCount ? `, ${expandedCount} expanded` : ''})</h2>`;
            
            units.forEach(u => {
                const isExpanded = u.expanded_from && u.expanded_from.length;
                catHTML += `
                    <div class="unit ${isExpanded ? 'expanded' : 'standalone'}">
                        <div class="unit-header">
                            <span class="unit-ref">${u.reference} (${u.verse_count}v)</span>
                            ${isExpanded ? '<span class="badge expanded">EXPANDED</span>' : '<span class="badge standalone">STANDALONE</span>'}
                        </div>
                        <div class="unit-text">${u.text}</div>
                        <div><span class="primary-cat">${u.primary_category}</span> ${u.secondary_categories ? u.secondary_categories.map(c => `<span class="primary-cat" style="background:#9b59b6">${c}</span>`).join('') : ''}</div>
                    </div>
                `;
            });
            
            // Close the wrapper div
            catHTML += `</div>`;
            content.innerHTML += catHTML;
        });
    })
    .catch(err => {
        document.getElementById('content').innerHTML = '<p style="color:red">Error loading data. Check console.</p>';
        console.error(err);
    });
</script>

</body>
</html>
