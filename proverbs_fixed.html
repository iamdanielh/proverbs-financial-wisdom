    <script>
        const insights = [{"chapter": 1, "headline": "Wealth needs roots before it bears fruit", "summary": "The fear of Yahweh is the beginning\u2014not destination\u2014of financial wisdom. Without this foundation, profit is a house on sand.", "key_points": ["Wisdom > Money", "Character is Capital", "Foundation First"], "proverbs_says": "Before counting money, learn to fear God. Proverbs' first lesson: foundation matters more than cash flow.", "color": "#1a237e", "icon": "\ud83c\udfdb\ufe0f"}, {"chapter": 2, "headline": "Treat labor like treasure\u2014seek it that way", "summary": "Seek wisdom as silver, search as hidden treasure. The mental model: wisdom = active pursuit = capital. Not passive.", "key_points": ["Diligence = Abundance", "Active Work", "Sow to Reap"], "proverbs_says": "You don't get wealthy; you get wisdom, and wisdom generates wealth. The search is active.", "color": "#00695c", "icon": "\u2692\ufe0f"}, {"chapter": 3, "headline": "Inaction compounds poverty", "summary": "Folded hands create debt as reliably as open hands create wealth. Poverty accumulates through neglect, not strikes.", "key_points": ["Motion > Stillness", "Avoid Folds", "Wake Up"], "proverbs_says": "Laziness mortgages your future for present ease. Poverty is behavioral failure with financial consequences.", "color": "#c62828", "icon": "\ud83d\udca4"}, {"chapter": 4, "headline": "Shortcuts destroy wisdom", "summary": "Counsel is more valuable than silver. Strategic planning precedes success. The wise consult; fools rush.", "key_points": ["Consult Widely", "Think Ahead", "Advice is Asset"], "proverbs_says": "Financial planning isn't lonely spreadsheet work\u2014it's communal wisdom. Your budget needs peer review.", "color": "#455a64", "icon": "\ud83e\udded"}, {"chapter": 5, "headline": "Hurry makes holes in pockets", "summary": "Wealth from gambling or quick gain is temporary. The one who hastens to be rich will not go unpunished.", "key_points": ["Patience > Speed", "Greed Self-Destructs", "Sustainable > Fast"], "proverbs_says": "Speed is the enemy of sustainability. Don't get rich fast\u2014the tortoise beats the hare in finance too.", "color": "#e65100", "icon": "\u26a1"}, {"chapter": 6, "headline": "Never sign what you can't pay", "summary": "Debt is a snare. Co-signing is explicitly warned. The borrower becomes servant to the lender. Free yourself.", "key_points": ["Debt = Bondage", "Avoid Surety", "Escape Early"], "proverbs_says": "Co-signing guarantees another's irresponsibility. Your signature enslaves you to their choices.", "color": "#b71c1c", "icon": "\u26d3\ufe0f"}, {"chapter": 7, "headline": "Give first, receive more", "summary": "Honor Yahweh with substance\u2014not surplus. Firstfruits unlock overflow. Generosity is physics, not charity.", "key_points": ["Firstfruits Principle", "Generosity Multiplies", "Open Hand"], "proverbs_says": "Give first, receive more. The universe honors generosity\u2014barns overflow to the giver.", "color": "#2e7d32", "icon": "\ud83d\udca7"}, {"chapter": 8, "headline": "Build barns before you need them", "summary": "The wise store up choice food; fools devour everything. Wealth requires delayed gratification and reserves.", "key_points": ["Build Reserves", "Delay Gratification", "Storage Matters"], "proverbs_says": "Wealth is built slowly, then suddenly. The barns of the diligent have surplus.", "color": "#f57c00", "icon": "\ud83d\udce6"}, {"chapter": 9, "headline": "Wisdom > Gold by every metric", "summary": "Silver, gold, rubies\u2014all valuable, but wisdom more so. Get wisdom though it costs all you have.", "key_points": ["Wisdom is Premium", "Prioritize Correctly", "ROI is Eternal"], "proverbs_says": "Most value wealth over wisdom. Proverbs corrects this: wisdom produces wealth, not vice versa.", "color": "#6a1b9a", "icon": "\ud83d\udc8e"}, {"chapter": 10, "headline": "False scales are discovered", "summary": "Just weights please God. Dishonest gain is ill-gotten and short-lived. Integrity in business is non-negotiable.", "key_points": ["Integrity Pays", "Deceit Fails", "Just Dealing"], "proverbs_says": "Dishonest money dwindles. The just balance is found out\u2014so use it from the start.", "color": "#37474f", "icon": "\u2696\ufe0f"}, {"chapter": 11, "headline": "Wealth transfers; character compounds", "summary": "A good name is more valuable than riches. Train children young. You steward for the next generation.", "key_points": ["Name > Money", "Train Children", "Think Generations"], "proverbs_says": "The house of the righteous stands. Build a lasting name, not just a bank account.", "color": "#5d4037", "icon": "\ud83c\udf33"}, {"chapter": 12, "headline": "Pay promptly; work faithfully", "summary": "The laborer is worthy of hire. Withhold not wages overnight. The worker deserves fair compensation.", "key_points": ["Prompt Payment", "Labor Reward", "Fairness"], "proverbs_says": "Don't sleep while workers wait for pay. Fair wages given quickly build trust and honor.", "color": "#00796b", "icon": "\ud83d\udcb5"}];
        const book = {"book_title": "Proverbs: Ancient Wisdom for Modern Finance", "chapters": [{"chapter": 1, "title": "The Foundation: Stewardship & Ownership", "section_count": 28, "sections": [{"range": "1:1-5", "title": "The proverbs of Solomon", "text": "The proverbs of Solomon to know wisdom and instruction; to discern the words of understanding; to receive instruction in wise dealing to give prudence to the simple that the wise man may hear", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["generosity/giving", "strategic planning"]}, {"range": "2:1-5", "title": "My son", "text": "My son So as to turn your ear to wisdom Yes If you seek her as silver then you will understand the fear of Yahweh", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["treasure/precious goods"]}, {"range": "2:6-10", "title": "For Yahweh gives wisdom...", "text": "For Yahweh gives wisdom. Out of his mouth comes knowledge and understanding. He lays up sound wisdom for the upright. He is a shield to those who walk in integrity; that he may guard the paths of justice Then you will understand righteousness and justice For wisdom will enter into your heart. Knowledge will be pleasant to your soul.", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["generosity/giving", "just dealing"]}, {"range": "3:6-10", "title": "In all your ways acknowledge him...", "text": "In all your ways acknowledge him Don't be wise in your own eyes. Fear Yahweh It will be health to your body Honor Yahweh with your substance so your barns will be filled with plenty", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["provision/storage", "generosity/giving"]}, {"range": "3:16-20", "title": "Length of days is in her right hand...", "text": "Length of days is in her right hand. In her left hand are riches and honor. Her ways are ways of pleasantness. All her paths are peace. She is a tree of life to those who lay hold of her. Happy is everyone who retains her. By wisdom Yahweh founded the earth. By understanding By his knowledge", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["wealth/riches", "diligence/industry"]}, {"range": "4:1-5", "title": "Listen", "text": "Listen for I give you sound learning. Don't forsake my law. For I was a son to my father He taught me Get wisdom. Get understanding. Don't forget", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["generosity/giving"]}, {"range": "8:11-15", "title": "For wisdom is better than rubies...", "text": "For wisdom is better than rubies. All the things that may be desired can't be compared to it. I The fear of Yahweh is to hate evil. I hate pride Counsel and sound knowledge are mine. I have understanding and power. By me kings reign", "summary": "Divine principles for leadership and governance", "financial_concepts": ["treasure/precious goods", "strategic planning"]}, {"range": "9:1-5", "title": "Wisdom has built her house...", "text": "Wisdom has built her house. She has carved out her seven pillars. She has prepared her meat. She has mixed her wine. She has also set her table. She has sent out her maidens. She cries from the highest places of the city: Whoever is simple Come", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy"]}, {"range": "10:11-15", "title": "The mouth of the righteous is a spring o...", "text": "The mouth of the righteous is a spring of life Hatred stirs up strife Wisdom is found on the lips of him who has discernment Wise men lay up knowledge The rich man's wealth is his strong city. The destruction of the poor is their poverty.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "poverty/need", "just dealing"]}, {"range": "10:26-30", "title": "As vinegar to the teeth", "text": "As vinegar to the teeth The fear of Yahweh prolongs days The prospect of the righteous is joy The way of Yahweh is a stronghold to the upright The righteous will never be removed", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["just dealing"]}, {"range": "10:31-32", "title": "The mouth of the righteous brings forth ...", "text": "The mouth of the righteous brings forth wisdom The lips of the righteous know what is acceptable", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["just dealing"]}, {"range": "11:11-15", "title": "By the blessing of the upright", "text": "By the blessing of the upright One who despises his neighbor is void of wisdom One who brings gossip betrays a confidence Where there is no wise guidance He who is collateral for a stranger will suffer for it", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["strategic planning"]}, {"range": "12:1-5", "title": "Whoever loves correction loves knowledge...", "text": "Whoever loves correction loves knowledge A good man shall obtain favor from Yahweh A man shall not be established by wickedness A worthy woman is the crown of her husband The thoughts of the righteous are just", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["just dealing"]}, {"range": "12:6-10", "title": "The words of the wicked are about lying ...", "text": "The words of the wicked are about lying in wait for blood The wicked are overthrown A man shall be commended according to his wisdom Better is he who is lightly esteemed A righteous man respects the life of his animal", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["just dealing"]}, {"range": "13:16-20", "title": "Every prudent man acts from knowledge...", "text": "Every prudent man acts from knowledge A wicked messenger falls into trouble Poverty and shame come to him who refuses discipline Longing fulfilled is sweet to the soul One who walks with wise men grows wise", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need"]}, {"range": "14:1-5", "title": "Every wise woman builds her house...", "text": "Every wise woman builds her house He who walks in his uprightness fears Yahweh The fool's talk brings a rod to his back Where no oxen are A truthful witness will not lie", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy"]}, {"range": "14:16-20", "title": "A wise man fears", "text": "A wise man fears He who is quick to become angry will commit folly The simple inherit folly The evil bow down before the good The poor person is shunned even by his own neighbor", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "inheritance/legacy", "greed/covetousness"]}, {"range": "14:31-35", "title": "He who oppresses the poor shows contempt...", "text": "He who oppresses the poor shows contempt for his Maker The wicked is brought down in his calamity Wisdom rests in the heart of one who has understanding Righteousness exalts a nation The king's favor is toward a servant who deals wisely", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["poverty/need", "just dealing"]}, {"range": "15:6-10", "title": "In the house of the righteous is much tr...", "text": "In the house of the righteous is much treasure The lips of the wise spread knowledge; not so with the heart of fools. The sacrifice made by the wicked is an abomination to Yahweh The way of the wicked is an abomination to Yahweh There is stern discipline for one who forsakes the way: whoever hates reproof shall die.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["treasure/precious goods", "inheritance/legacy", "just dealing"]}, {"range": "16:6-10", "title": "By mercy and truth iniquity is atoned fo...", "text": "By mercy and truth iniquity is atoned for. By the fear of Yahweh men depart from evil. When a man's ways please Yahweh Better is a little with righteousness A man's heart plans his course Inspired judgments are on the lips of the king. He shall not betray his mouth.", "summary": "Divine principles for leadership and governance", "financial_concepts": ["strategic planning", "just dealing"]}, {"range": "16:16-20", "title": "How much better it is to get wisdom than...", "text": "How much better it is to get wisdom than gold! Yes The highway of the upright is to depart from evil. He who keeps his way preserves his soul. Pride goes before destruction It is better to be of a lowly spirit with the poor He who heeds the Word finds prosperity. Whoever trusts in Yahweh is blessed.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["treasure/precious goods", "wealth/riches", "poverty/need"]}, {"range": "17:26-28", "title": "Also to punish the righteous is not good...", "text": "Also to punish the righteous is not good He who spares his words has knowledge. He who is even tempered is a man of understanding. Even a fool", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["just dealing"]}, {"range": "19:6-10", "title": "Many will entreat the favor of a ruler...", "text": "Many will entreat the favor of a ruler All the relatives of the poor shun him: how much more do his friends avoid him! He pursues them with pleas He who gets wisdom loves his own soul. He who keeps understanding shall find good. A false witness shall not be unpunished. He who utters lies shall perish. Delicate living is not appropriate for a fool", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "dishonest gain", "stewardship"]}, {"range": "22:16-20", "title": "Whoever oppresses the poor for his own i...", "text": "Whoever oppresses the poor for his own increase and whoever gives to the rich Turn your ear For it is a pleasant thing if you keep them within you That your trust may be in Yahweh Haven't I written to you thirty excellent things of counsel and knowledge", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["wealth/riches", "poverty/need", "generosity/giving"]}, {"range": "24:1-5", "title": "Don't be envious of evil men; neither de...", "text": "Don't be envious of evil men; neither desire to be with them: for their hearts plot violence Through wisdom a house is built; by understanding it is established; by knowledge the rooms are filled with all rare and beautiful treasure. A wise man has great power; and a knowledgeable man increases strength;", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["treasure/precious goods", "inheritance/legacy", "generosity/giving"]}, {"range": "24:6-10", "title": "for by wise guidance you wage your war; ...", "text": "for by wise guidance you wage your war; and victory is in many advisors. Wisdom is too high for a fool: he doesn't open his mouth in the gate. One who plots to do evil will be called a schemer. The schemes of folly are sin. The mocker is detested by men. If you falter in the time of trouble", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["strategic planning"]}, {"range": "24:13-17", "title": "My son", "text": "My son so you shall know wisdom to be to your soul; if you have found it Don't lay in wait for a righteous man falls seven times Don't rejoice when your enemy falls. Don't let your heart be glad when he is overthrown;", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["just dealing"]}, {"range": "28:26-28", "title": "One who trusts in himself is a fool; but...", "text": "One who trusts in himself is a fool; but one who walks in wisdom is kept safe. One who gives to the poor has no lack; but one who closes his eyes will have many curses. When the wicked rise", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "generosity/giving"]}]}, {"chapter": 2, "title": "Income: The Diligence Principle", "section_count": 18, "sections": [{"range": "4:20-24", "title": "My son", "text": "My son Let them not depart from your eyes. Keep them in the midst of your heart. For they are life to those who find them Keep your heart with all diligence Put away from yourself a perverse mouth. Put corrupt lips far from you.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["diligence/industry"]}, {"range": "4:25-27", "title": "Let your eyes look straight ahead...", "text": "Let your eyes look straight ahead. Fix your gaze directly before you. Make the path of your feet level. Let all of your ways be established. Don't turn to the right hand nor to the left. Remove your foot from evil.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["diligence/industry"]}, {"range": "10:1-5", "title": "The proverbs of Solomon...", "text": "The proverbs of Solomon. A wise son makes a glad father; but a foolish son brings grief to his mother. Treasures of wickedness profit nothing Yahweh will not allow the soul of the righteous to go hungry He becomes poor who works with a lazy hand He who gathers in summer is a wise son", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["treasure/precious goods", "poverty/need", "wages/work income"]}, {"range": "10:16-20", "title": "The labor of the righteous leads to life...", "text": "The labor of the righteous leads to life. The increase of the wicked leads to sin. He is in the way of life who heeds correction He who hides hatred has lying lips. He who utters a slander is a fool. In the multitude of words there is no lack of disobedience The tongue of the righteous is like choice silver. The heart of the wicked is of little worth.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["treasure/precious goods", "poverty/need", "wages/work income"]}, {"range": "12:11-15", "title": "He who tills his land shall have plenty ...", "text": "He who tills his land shall have plenty of bread The wicked desires the plunder of evil men An evil man is trapped by sinfulness of lips A man shall be satisfied with good by the fruit of his mouth. The work of a man's hands shall be rewarded to him. The way of a fool is right in his own eyes", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wages/work income", "provision/storage", "diligence/industry"]}, {"range": "12:21-25", "title": "No mischief shall happen to the righteou...", "text": "No mischief shall happen to the righteous Lying lips are an abomination to Yahweh A prudent man keeps his knowledge The hands of the diligent ones shall rule Anxiety in a man's heart weighs it down", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["diligence/industry", "just dealing", "stewardship"]}, {"range": "16:26-30", "title": "The appetite of the laboring man labors ...", "text": "The appetite of the laboring man labors for him; for his mouth urges him on. A worthless man devises mischief. His speech is like a scorching fire. A perverse man stirs up strife. A whisperer separates close friends. A man of violence entices his neighbor One who winks his eyes to plot perversities", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wages/work income"]}, {"range": "18:6-10", "title": "A fool's lips come into strife", "text": "A fool's lips come into strife A fool's mouth is his destruction The words of a gossip are like dainty morsels: they go down into a person's innermost parts. One who is slack in his work is brother to him who is a master of destruction. The name of Yahweh is a strong tower: the righteous run to him", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "wages/work income", "just dealing"]}, {"range": "18:16-20", "title": "A man's gift makes room for him...", "text": "A man's gift makes room for him He who pleads his cause first seems right; until another comes and questions him. The lot settles disputes A brother offended is more difficult than a fortified city; and disputes are like the bars of a castle. A man's stomach is filled with the fruit of his mouth. With the harvest of his lips he is satisfied.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wages/work income", "generosity/giving"]}, {"range": "20:1-5", "title": "Wine is a mocker", "text": "Wine is a mocker The terror of a king is like the roaring of a lion. He who provokes him to anger forfeits his own life. It is an honor for a man to keep aloof from strife; but every fool will be quarreling. The sluggard will not plow by reason of the winter; therefore he shall beg in harvest Counsel in the heart of man is like deep water; but a man of understanding will draw it out.", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["wages/work income", "strategic planning", "laziness/poverty"]}, {"range": "21:1-5", "title": "The king's heart is in Yahweh's hand lik...", "text": "The king's heart is in Yahweh's hand like the watercourses. He turns it wherever he desires. Every way of a man is right in his own eyes To do righteousness and justice is more acceptable to Yahweh than sacrifice. A high look The plans of the diligent surely lead to profit; and everyone who is hasty surely rushes to poverty.", "summary": "Divine principles for leadership and governance", "financial_concepts": ["poverty/need", "trade/commerce", "strategic planning"]}, {"range": "22:26-29", "title": "Don't you be one of those who strike han...", "text": "Don't you be one of those who strike hands If you don't have means to pay Don't move the ancient boundary stone Do you see a man skilled in his work? He will serve kings. He won't serve obscure men.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wages/work income", "diligence/industry"]}, {"range": "26:6-10", "title": "One who sends a message by the hand of a...", "text": "One who sends a message by the hand of a fool is cutting off feet and drinking violence. Like the legs of the lame that hang loose: so is a parable in the mouth of fools. As one who binds a stone in a sling Like a thornbush that goes into the hand of a drunkard As an archer who wounds all", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["diligence/industry"]}, {"range": "26:26-28", "title": "His malice may be concealed by deception...", "text": "His malice may be concealed by deception Whoever digs a pit shall fall into it. Whoever rolls a stone A lying tongue hates those it hurts; and a flattering mouth works ruin.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wages/work income"]}, {"range": "30:21-25", "title": "For three things the earth tremble...", "text": "For three things the earth tremble For a servant when he is king; a fool when he is filled with food; for an unloved woman when she is married; and a handmaid who is heir to her mistress. There are four things which are little on the earth the ants are not a strong people", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["provision/storage", "diligence/industry"]}, {"range": "30:26-30", "title": "The conies are but a feeble folk...", "text": "The conies are but a feeble folk The locusts have no king You can catch a lizard with your hands There are three things which are stately in their march The lion", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["diligence/industry"]}, {"range": "31:16-20", "title": "She considers a field", "text": "She considers a field She arms her waist with strength She perceives that her merchandise is profitable. Her lamp doesn't go out by night. She lays her hands to the distaff She opens her arms to the poor; yes", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "trade/commerce", "diligence/industry"]}, {"range": "31:31", "title": "Give her of the fruit of her hands! Let ...", "text": "Give her of the fruit of her hands! Let her works praise her in the gates!", "summary": "Standalone wisdom on: Give her of the fruit of her hands! Let her works ...", "financial_concepts": ["wages/work income", "generosity/giving", "diligence/industry"]}]}, {"chapter": 3, "title": "The Sluggard's Path", "section_count": 20, "sections": [{"range": "4:15-19", "title": "Avoid it", "text": "Avoid it For they don't sleep For they eat the bread of wickedness But the path of the righteous is like the dawning light The way of the wicked is like darkness. They don't know what they stumble over.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["laziness/poverty", "just dealing"]}, {"range": "5:21-23", "title": "For the ways of man are before the eyes ...", "text": "For the ways of man are before the eyes of Yahweh. He examines all his paths. The evil deeds of the wicked ensnare him. The cords of his sin hold him firmly. He will die for lack of instruction. In the greatness of his folly", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need"]}, {"range": "6:1-5", "title": "My son", "text": "My son You are trapped by the words of your mouth. You are ensnared with the words of your mouth. Do this now Give no sleep to your eyes Free yourself", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["generosity/giving", "laziness/poverty"]}, {"range": "6:6-10", "title": "Go to the ant", "text": "Go to the ant which having no chief provides her bread in the summer How long will you sleep A little sleep", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["laziness/poverty"]}, {"range": "6:11-15", "title": "so your poverty will come as a robber...", "text": "so your poverty will come as a robber A worthless person who winks with his eyes in whose heart is perverseness Therefore his calamity will come suddenly. He will be broken suddenly", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need"]}, {"range": "12:26-28", "title": "A righteous person is cautious in friend...", "text": "A righteous person is cautious in friendship The slothful man doesn't roast his game In the way of righteousness is life; in its path there is no death.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["laziness/poverty", "just dealing"]}, {"range": "13:1-5", "title": "A wise son listens to his father's instr...", "text": "A wise son listens to his father's instruction By the fruit of his lips He who guards his mouth guards his soul. One who opens wide his lips comes to ruin. The soul of the sluggard desires A righteous man hates lies", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["laziness/poverty", "just dealing"]}, {"range": "15:16-20", "title": "Better is little", "text": "Better is little Better is a dinner of herbs A wrathful man stirs up contention The way of the sluggard is like a thorn patch A wise son makes a father glad", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["laziness/poverty"]}, {"range": "18:21-24", "title": "Death and life are in the power of the t...", "text": "Death and life are in the power of the tongue; those who love it will eat its fruit. Whoever finds a wife finds a good thing The poor plead for mercy A man of many companions may be ruined", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need"]}, {"range": "19:11-15", "title": "The discretion of a man makes him slow t...", "text": "The discretion of a man makes him slow to anger. It is his glory to overlook an offense. The king's wrath is like the roaring of a lion A foolish son is the calamity of his father. A wife's quarrels are a continual dripping. House and riches are an inheritance from fathers Slothfulness casts into a deep sleep. The idle soul shall suffer hunger.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "inheritance/legacy", "laziness/poverty"]}, {"range": "19:20-24", "title": "Listen to counsel and receive instructio...", "text": "Listen to counsel and receive instruction There are many plans in a man's heart That which makes a man to be desired is his kindness. A poor man is better than a liar. The fear of Yahweh leads to life The sluggard buries his hand in the dish; he will not so much as bring it to his mouth again.", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["poverty/need", "trade/commerce", "strategic planning"]}, {"range": "21:21-25", "title": "He who follows after righteousness and k...", "text": "He who follows after righteousness and kindness finds life A wise man scales the city of the mighty Whoever guards his mouth and his tongue keeps his soul from troubles. The proud and haughty man The desire of the sluggard kills him", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["laziness/poverty", "just dealing"]}, {"range": "22:11-15", "title": "He who loves purity of heart and speaks ...", "text": "He who loves purity of heart and speaks gracefully is the king's friend. The eyes of Yahweh watch over knowledge; but he frustrates the words of the unfaithful. The sluggard says The mouth of an adulteress is a deep pit: he who is under Yahweh's wrath will fall into it. Folly is bound up in the heart of a child: the rod of discipline drives it far from him.", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["laziness/poverty"]}, {"range": "22:21-25", "title": "To teach you truth", "text": "To teach you truth Don't exploit the poor for Yahweh will plead their case Don't befriend a hot-tempered man lest you learn his ways", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need"]}, {"range": "23:19-21", "title": "Listen", "text": "Listen Don't be among ones drinking too much wine for the drunkard and the glutton shall become poor; and drowsiness clothes them in rags.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need"]}, {"range": "24:26-30", "title": "An honest answer is like a kiss on the l...", "text": "An honest answer is like a kiss on the lips. Prepare your work outside Don't be a witness against your neighbor without cause. Don't deceive with your lips. Don't say I went by the field of the sluggard", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["wages/work income", "trade/commerce", "laziness/poverty"]}, {"range": "24:31-34", "title": "Behold", "text": "Behold Then I saw a little sleep so your poverty will come as a robber", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "laziness/poverty"]}, {"range": "26:11-15", "title": "As a dog that returns to his vomit...", "text": "As a dog that returns to his vomit Do you see a man wise in his own eyes? There is more hope for a fool than for him. The sluggard says As the door turns on its hinges The sluggard buries his hand in the dish. He is too lazy to bring it back to his mouth.", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["diligence/industry", "laziness/poverty"]}, {"range": "26:16-20", "title": "The sluggard is wiser in his own eyes th...", "text": "The sluggard is wiser in his own eyes than seven men who answer with discretion. Like one who grabs a dog's ears is one who passes by and meddles in a quarrel not his own. Like a madman who shoots torches is the man who deceives his neighbor and says For lack of wood a fire goes out. Without gossip", "summary": "Contrast between diligent and lazy approaches to work and provision", "financial_concepts": ["poverty/need", "laziness/poverty"]}, {"range": "28:1-5", "title": "The wicked flee when no one pursues; but...", "text": "The wicked flee when no one pursues; but the righteous are as bold as a lion. In rebellion A needy man who oppresses the poor is like a driving rain which leaves no crops. Those who forsake the law praise the wicked; but those who keep the law contend with them. Evil men don't understand justice; but those who seek Yahweh understand it fully.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "just dealing"]}]}, {"chapter": 4, "title": "Strategic Planning", "section_count": 6, "sections": [{"range": "1:25-29", "title": "but you have ignored all my counsel...", "text": "but you have ignored all my counsel I also will laugh at your disaster. I will mock when calamity overtakes you; when calamity overtakes you like a storm Then will they call on me because they hated knowledge", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["strategic planning"]}, {"range": "1:30-33", "title": "They wanted none of my counsel...", "text": "They wanted none of my counsel. They despised all my reproof. Therefore they will eat of the fruit of their own way For the backsliding of the simple will kill them. The careless ease of fools will destroy them. But whoever listens to me will dwell securely", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["poverty/need", "strategic planning"]}, {"range": "15:21-25", "title": "Folly is joy to one who is void of wisdo...", "text": "Folly is joy to one who is void of wisdom Where there is no counsel Joy comes to a man with the reply of his mouth. How good is a word at the right time! The path of life leads upward for the wise Yahweh will uproot the house of the proud", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy", "strategic planning"]}, {"range": "16:1-5", "title": "The plans of the heart belong to man...", "text": "The plans of the heart belong to man All the ways of a man are clean in his own eyes; but Yahweh weighs the motives. Commit your deeds to Yahweh Yahweh has made everything for its own end&#8212; yes Everyone who is proud in heart is an abomination to Yahweh: they shall certainly not be unpunished.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["strategic planning"]}, {"range": "20:16-20", "title": "Take the garment of one who puts up coll...", "text": "Take the garment of one who puts up collateral for a stranger; and hold him in pledge for a wayward woman. Fraudulent food is sweet to a man Plans are established by advice; by wise guidance you wage war! He who goes about as a tale-bearer reveals secrets; therefore don't keep company with him who opens wide his lips. Whoever curses his father or his mother", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["provision/storage", "dishonest gain", "strategic planning"]}, {"range": "27:6-10", "title": "Faithful are the wounds of a friend; alt...", "text": "Faithful are the wounds of a friend; although the kisses of an enemy are profuse. A full soul loathes a honeycomb; but to a hungry soul As a bird that wanders from her nest Perfume and incense bring joy to the heart; so does earnest counsel from a man's friend. Don't forsake your friend and your father's friend. Don't go to your brother's house in the day of your disaster: better is a neighbor who is near than a distant brother.", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["inheritance/legacy", "strategic planning"]}]}, {"chapter": 5, "title": "Contentment vs. Greed", "section_count": 14, "sections": [{"range": "1:15-19", "title": "My son", "text": "My son for their feet run to evil. They hurry to shed blood. For in vain is the net spread in the sight of any bird: but these lay wait for their own blood. They lurk secretly for their own lives. So are the ways of everyone who is greedy for gain. It takes away the life of its owners.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["trade/commerce", "greed/covetousness"]}, {"range": "2:16-20", "title": "To deliver you from the strange woman...", "text": "To deliver you from the strange woman who forsakes the friend of her youth for her house leads down to death None who go to her return again that you may walk in the way of good men", "summary": "Warning against sexual immorality with consequences", "financial_concepts": ["inheritance/legacy", "trade/commerce", "greed/covetousness"]}, {"range": "3:26-30", "title": "for Yahweh will be your confidence...", "text": "for Yahweh will be your confidence Don't withhold good from those to whom it is due Don't say to your neighbor Don't devise evil against your neighbor Don't strive with a man without cause", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["trade/commerce", "greed/covetousness"]}, {"range": "6:16-19", "title": "There are six things which Yahweh hates;...", "text": "There are six things which Yahweh hates; yes haughty eyes a heart that devises wicked schemes a false witness who utters lies", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["dishonest gain"]}, {"range": "8:36", "title": "But he who sins against me wrongs his ow...", "text": "But he who sins against me wrongs his own soul. All those who hate me love death.", "summary": "Standalone wisdom on: But he who sins against me wrongs his own soul. Al...", "financial_concepts": ["trade/commerce", "greed/covetousness"]}, {"range": "9:16-18", "title": "Whoever is simple", "text": "Whoever is simple Stolen water is sweet. Food eaten in secret is pleasant. But he doesn't know that the dead are there", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["provision/storage", "dishonest gain"]}, {"range": "15:26-30", "title": "Yahweh detests the thoughts of the wicke...", "text": "Yahweh detests the thoughts of the wicked He who is greedy for gain troubles his own house The heart of the righteous weighs answers Yahweh is far from the wicked The light of the eyes rejoices the heart. Good news gives health to the bones.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy", "generosity/giving", "trade/commerce"]}, {"range": "17:11-15", "title": "An evil man seeks only rebellion; theref...", "text": "An evil man seeks only rebellion; therefore a cruel messenger shall be sent against him. Let a bear robbed of her cubs meet a man Whoever rewards evil for good The beginning of strife is like breaching a dam He who justifies the wicked", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["trade/commerce", "greed/covetousness", "just dealing"]}, {"range": "20:21-25", "title": "An inheritance quickly gained at the beg...", "text": "An inheritance quickly gained at the beginning Don't say Yahweh detests differing weights A man's steps are from Yahweh; how then can man understand his way? It is a snare to a man to make a rash dedication", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy", "trade/commerce", "greed/covetousness"]}, {"range": "21:26-30", "title": "There are those who covet greedily all d...", "text": "There are those who covet greedily all day long; but the righteous give and don't withhold. The sacrifice of the wicked is an abomination: how much more A false witness will perish A wicked man hardens his face; but as for the upright There is no wisdom nor understanding nor counsel against Yahweh.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["generosity/giving", "trade/commerce", "dishonest gain"]}, {"range": "23:11-14", "title": "for their Defender is strong...", "text": "for their Defender is strong. He will plead their case against you. Apply your heart to instruction Don't withhold correction from a child. If you punish him with the rod Punish him with the rod", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["trade/commerce", "greed/covetousness"]}, {"range": "25:16-20", "title": "Have you found honey? Eat as much as is ...", "text": "Have you found honey? Eat as much as is sufficient for you Let your foot be seldom in your neighbor's house A man who gives false testimony against his neighbor is like a club Confidence in someone unfaithful in time of trouble is like a bad tooth As one who takes away a garment in cold weather", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy", "generosity/giving", "trade/commerce"]}, {"range": "28:21-25", "title": "To show partiality is not good; yet a ma...", "text": "To show partiality is not good; yet a man will do wrong for a piece of bread. A stingy man hurries after riches One who rebukes a man will afterward find more favor than one who flatters with the tongue. Whoever robs his father or his mother One who is greedy stirs up strife; but one who trusts in Yahweh will prosper.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "greed/covetousness"]}, {"range": "31:11-15", "title": "The heart of her husband trusts in her...", "text": "The heart of her husband trusts in her. He shall have no lack of gain. She does him good She seeks wool and flax She is like the merchant ships. She brings her bread from afar. She rises also while it is yet night", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["poverty/need", "trade/commerce", "greed/covetousness"]}]}, {"chapter": 6, "title": "Debt & Surety", "section_count": 5, "sections": [{"range": "4:6-9", "title": "Don't forsake her", "text": "Don't forsake her Wisdom is supreme. Get wisdom. Yes Esteem her She will give to your head a garland of grace. She will deliver a crown of splendor to you.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["debt/borrowing", "generosity/giving"]}, {"range": "17:16-20", "title": "Why is there money in the hand of a fool...", "text": "Why is there money in the hand of a fool to buy wisdom A friend loves at all times; and a brother is born for adversity. A man void of understanding strikes hands He who loves disobedience loves strife. One who builds a high gate seeks destruction. One who has a perverse heart doesn't find prosperity", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "debt/borrowing", "trade/commerce"]}, {"range": "19:16-19", "title": "He who keeps the commandment keeps his s...", "text": "He who keeps the commandment keeps his soul He who has pity on the poor lends to Yahweh; he will reward him. Discipline your son A hot-tempered man must pay the penalty", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "debt/borrowing"]}, {"range": "20:26-30", "title": "A wise king winnows out the wicked...", "text": "A wise king winnows out the wicked The spirit of man is Yahweh's lamp Love and faithfulness keep the king safe. His throne is sustained by love. The glory of young men is their strength. The splendor of old men is their gray hair. Wounding blows cleanse away evil", "summary": "Divine principles for leadership and governance", "financial_concepts": ["debt/borrowing", "stewardship"]}, {"range": "22:6-10", "title": "Train up a child in the way he should go...", "text": "Train up a child in the way he should go The rich rule over the poor. The borrower is servant to the lender. He who sows wickedness reaps trouble He who has a generous eye will be blessed; for he shares his food with the poor. Drive out the mocker", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["wealth/riches", "poverty/need", "debt/borrowing"]}]}, {"chapter": 7, "title": "Generosity", "section_count": 2, "sections": [{"range": "30:11-15", "title": "There is a generation that curses their ...", "text": "There is a generation that curses their father There is a generation that is pure in their own eyes There is a generation There is a generation whose teeth are like swords The leach has two daughters: 'Give", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["generosity/giving"]}, {"range": "31:1-5", "title": "The words of king Lemuel; the oracle whi...", "text": "The words of king Lemuel; the oracle which his mother taught him. Oh Don't give your strength to women It is not for kings lest they drink", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["generosity/giving"]}]}, {"chapter": 8, "title": "Wealth Building", "section_count": 23, "sections": [{"range": "1:10-14", "title": "My son", "text": "My son If they say let's swallow them up alive like Sheol We'll find all valuable wealth. We'll fill our houses with spoil. You shall cast your lot among us. We'll all have one purse.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "inheritance/legacy"]}, {"range": "5:6-10", "title": "She gives no thought to the way of life...", "text": "She gives no thought to the way of life. Her ways are crooked Now therefore Remove your way far from her. Don't come near the door of her house lest you give your honor to others lest strangers feast on your wealth", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "inheritance/legacy", "generosity/giving"]}, {"range": "8:16-20", "title": "By me princes rule; nobles", "text": "By me princes rule; nobles I love those who love me. Those who seek me diligently will find me. With me are riches My fruit is better than gold I walk in the way of righteousness", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["treasure/precious goods", "wealth/riches", "diligence/industry"]}, {"range": "8:21-25", "title": "That I may give wealth to those who love...", "text": "That I may give wealth to those who love me. I fill their treasuries. Yahweh possessed me in the beginning of his work I was set up from everlasting When there were no depths Before the mountains were settled in place", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "wages/work income", "generosity/giving"]}, {"range": "10:21-25", "title": "The lips of the righteous feed many...", "text": "The lips of the righteous feed many Yahweh's blessing brings wealth It is a fool's pleasure to do wickedness What the wicked fear When the whirlwind passes", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "just dealing"]}, {"range": "11:1-5", "title": "A false balance is an abomination to Yah...", "text": "A false balance is an abomination to Yahweh When pride comes The integrity of the upright shall guide them Riches don't profit in the day of wrath The righteousness of the blameless will direct his way", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "trade/commerce", "dishonest gain"]}, {"range": "11:26-30", "title": "People curse someone who withholds grain...", "text": "People curse someone who withholds grain He who diligently seeks good seeks favor He who trusts in his riches will fall He who troubles his own house shall inherit the wind. The foolish shall be servant to the wise of heart. The fruit of the righteous is a tree of life. He who is wise wins souls.", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["wealth/riches", "inheritance/legacy", "provision/storage"]}, {"range": "13:6-10", "title": "Righteousness guards the way of integrit...", "text": "Righteousness guards the way of integrity There are some who pretend to be rich The ransom of a man's life is his riches The light of the righteous shines brightly Pride only breeds quarrels", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "just dealing"]}, {"range": "13:11-15", "title": "Wealth gained dishonestly dwindles away...", "text": "Wealth gained dishonestly dwindles away Hope deferred makes the heart sick Whoever despises instruction will pay for it The teaching of the wise is a spring of life Good understanding wins favor; but the way of the unfaithful is hard.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "trade/commerce", "dishonest gain"]}, {"range": "13:21-25", "title": "Misfortune pursues sinners", "text": "Misfortune pursues sinners A good man leaves an inheritance to his children's children An abundance of food is in poor people's fields One who spares the rod hates his son The righteous one eats to the satisfying of his soul", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "poverty/need", "inheritance/legacy"]}, {"range": "14:21-25", "title": "He who despises his neighbor sins...", "text": "He who despises his neighbor sins Don't they go astray who plot evil? But love and faithfulness belong to those who plan good. In all hard work there is profit The crown of the wise is their riches A truthful witness saves souls", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "wages/work income", "trade/commerce"]}, {"range": "18:11-15", "title": "The rich man's wealth is his strong city...", "text": "The rich man's wealth is his strong city Before destruction the heart of man is proud He who gives answer before he hears A man's spirit will sustain him in sickness The heart of the discerning gets knowledge. The ear of the wise seeks knowledge.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["wealth/riches", "generosity/giving"]}, {"range": "19:1-5", "title": "Better is the poor who walks in his inte...", "text": "Better is the poor who walks in his integrity than isdom", "financial_concepts": ["dishonest gain", "just dealing", "stewardship"]}]}, {"chapter": 11, "title": "Legacy & Inheritance", "section_count": 12, "sections": [{"range": "3:31-35", "title": "Don't envy the man of violence...", "text": "Don't envy the man of violence. Choose none of his ways. For the perverse is an abomination to Yahweh Yahweh's curse is in the house of the wicked Surely he mocks the mockers The wise will inherit glory", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy"]}, {"range": "7:6-10", "title": "For at the window of my house", "text": "For at the window of my house I saw among the simple ones. I discerned among the youths a young man void of understanding passing through the street near her corner in the twilight Behold", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy"]}, {"range": "7:11-15", "title": "She is loud and defiant...", "text": "She is loud and defiant. Her feet don't stay in her house. Now she is in the streets So she caught him Sacrifices of peace offerings are with me. This day I have paid my vows. Therefore I came out to meet you", "summary": "Lessons from creatures demonstrating wisdom and industry", "financial_concepts": ["inheritance/legacy"]}, {"range": "7:26-27", "title": "for she has thrown down many wounded...", "text": "for she has thrown down many wounded. Yes Her house is the way to Sheol", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy"]}, {"range": "9:11-15", "title": "For by me your days will be multiplied...", "text": "For by me your days will be multiplied. The years of your life will be increased. If you are wise The foolish woman is loud She sits at the door of her house To call to those who pass by", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy", "generosity/giving"]}, {"range": "14:11-15", "title": "The house of the wicked will be ngry", "text": "If your enemy is hungry for you will heap coals of fire on his head The north wind brings forth rain: so a backbiting tongue brings an angry face. It is better to dwell in the corner of the housetop Like cold water to a thirsty soul", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy"]}, {"range": "31:21-25", "title": "She is not afraid of the snow for her ho...", "text": "She is not afraid of the snow for her household; for all her household are clothed with scarlet. She makes for herself carpets of tapestry. Her clothing is fine linen and purple. Her husband is respected in the gates She makes linen garments and sells them Strength and dignity are her clothing. She laughs at the time to come.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy", "trade/commerce", "stewardship"]}, {"range": "31:26-30", "title": "She opens her mouth with wisdom...", "text": "She opens her mouth with wisdom. Faithful instruction is on her tongue. She looks well to the ways of her household Her children rise up and call her blessed. Her husband also praises her: Many women do noble things Charm is deceitful", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["inheritance/legacy", "dishonest gain", "stewardship"]}]}, {"chapter": 12, "title": "Wages & Compensation", "section_count": 1, "sections": [{"range": "21:11-15", "title": "When the mocker is punished", "text": "When the mocker is punished The Righteous One considers the house of the wicked Whoever stops his ears at the cry of the poor A gift in secret pacifies anger; and a bribe in the cloak It is joy to the righteous to do justice; but it is a destruction to the workers of iniquity.", "summary": "Thematic unit on practical wisdom", "financial_concepts": ["poverty/need", "wages/work income", "inheritance/legacy"]}]}], "uncategorized": [{"range": "23:6-10", "title": "Don't eat the food of him who has a stin...", "         let currentChapter = 0;
        
        function init() {
            const nav = document.getElementById("nav");
            nav.innerHTML = '<button class="nav-btn active" onclick="showChapter(0)">📊 All</button>' + 
                insights.map(i => '<button class="nav-btn" onclick="showChapter('+i.chapter+')">'+i.chapter+'</button>').join("");
            render();
            document.getElementById("search").addEventListener("input", render);
        }
        
        function showChapter(n) {
            currentChapter = n;
            document.querySelectorAll(".nav-btn").forEach((b,i) => b.classList.toggle("active", i===n));
            render();
        }
        
        function render() {
            const search = document.getElementById("search").value.toLowerCase();
            const container = document.getElementById("content");
            let html = "";
            
            const chapters = currentChapter === 0 ? book.chapters : [book.chapters[currentChapter-1]];
            
            chapters.forEach((ch, idx) => {
                const chapNum = currentChapter === 0 ? idx + 1 : currentChapter;
                const insight = insights.find(i => i.chapter === chapNum);
                
                if (insight) {
                    html += '<div class="insight-card">' +
                        '<div class="insight-header" style="background: '+insight.color+'">' +
                            '<div class="insight-icon">'+insight.icon+'</div>' +
                            '<div class="insight-chapter">Chapter '+insight.chapter+'</div>' +
                            '<div class="insight-headline">'+insight.headline+'</div>' +
                        '</div>' +
                        '<div class="insight-body">' +
                            '<div class="insight-summary">'+insight.summary+'</div>' +
                            '<div class="insight-proverbs" style="border-color: '+insight.color+'"><strong>Proverbs Says:</strong> '+insight.proverbs_says+'</div>' +
                            '<div class="key-points">'+insight.key_points.map(p => '<span class="key-point">'+p+'</span>').join("")+'</div>' +
                        '</div></div>';
                }
                
                const filtered = ch.sections.filter(s => {
                    if (!s.financial_concepts || s.financial_concepts.length === 0) return false;
                    if (!search) return true;
                    return s.text.toLowerCase().includes(search) || s.title.toLowerCase().includes(search) || s.financial_concepts.some(c => c.toLowerCase().includes(search));
                });
                
                filtered.forEach(s => {
                    html += '<div class="verse-section">' +
                        '<div class="verse-header">' +
                            '<span class="verse-title">'+s.title+'</span>' +
                            '<span class="verse-range">'+s.range+'</span>' +
                        '</div>' +
                        '<div class="verse-text">'+s.text+'</div>' +
                        '<div class="verse-concepts">'+s.financial_concepts.map(c => '<span class="concept-tag">'+c+'</span>').join("")+'</div>' +
                    '</div>';
                });
            });
            
            container.innerHTML = html || "<p style='color:white;text-align:center;padding:2rem'>No results found</p>";
        }
        
        init();
    </script>
